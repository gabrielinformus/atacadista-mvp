  h += '</div>'; // modal-body

  h += '<div class="modal-footer">';
  if (editing) h += '<button class="btn btn-outline" style="margin-right:auto;color:var(--red);border-color:var(--red)" onclick="confirmarExcluirProduto('+pid+')">🗑 Excluir</button>';
  h += '<button class="btn btn-outline" onclick="closeModal()">Cancelar</button>';
  h += '<button class="btn btn-primary" onclick="salvarProduto('+(editing?pid:'null')+')">'+(editing?'💾 Salvar alterações':'➕ Cadastrar produto')+'</button>';
  h += '</div>';

  content.innerHTML = h;
  overlay.classList.add('open');
}

function atualizarSubcategorias() {
  var cat = document.getElementById('np-cat').value;
  var subs = (CATEGORIES.find(function(c){return c.id===cat;})||{}).subs || [];
  var sel = document.getElementById('np-sub');
  sel.innerHTML = subs.map(function(s){return '<option value="'+s+'">'+s+'</option>';}).join('');
}

function lerImagemProduto(ev, idx) {
  var file = ev.target.files[0];
  if (!file) return;
  if (file.size > 2*1024*1024) { toast('Imagem muito grande (máx 2MB). Tenta uma menor.','warn'); return; }
  var reader = new FileReader();
  reader.onload = function(e) {
    var dataUrl = e.target.result;
    document.getElementById('img-data-'+idx).value = dataUrl;
    document.getElementById('prev-img-'+idx).innerHTML = '<img src="'+dataUrl+'" style="max-width:100%;max-height:100%;object-fit:contain">';
  };
  reader.readAsDataURL(file);
}
function usarEmojiProduto(idx) {
  var e = prompt('Cole um emoji (ex: 🔧 📦 🚿):');
  if (!e) return;
  document.getElementById('img-data-'+idx).value = e;
  document.getElementById('prev-img-'+idx).innerHTML = e;
}
function limparImagemProduto(idx) {
  document.getElementById('img-data-'+idx).value = '';
  document.getElementById('prev-img-'+idx).innerHTML = '➕';
}

function salvarProduto(pid) {
  var name = document.getElementById('np-name').value.trim();
  var price = parseFloat(document.getElementById('np-price').value);
  var stock = parseInt(document.getElementById('np-stock').value,10);
  var ncm = document.getElementById('np-ncm').value.trim();
  if (!name) { toast('Faltou o nome do produto.','warn'); return; }
  if (!price || price <= 0) { toast('Preço inválido.','warn'); return; }
  if (isNaN(stock) || stock < 0) { toast('Estoque inválido.','warn'); return; }
  if (!ncm) { toast('NCM é obrigatório.','warn'); return; }

  var cat = document.getElementById('np-cat').value;
  var catLabel = (CATEGORIES.find(function(c){return c.id===cat;})||{}).label || cat;
  var imgs = [];
  for (var i=0; i<3; i++) {
    var v = document.getElementById('img-data-'+i).value;
    if (v) imgs.push(v);
  }
  if (!imgs.length) imgs = ['📦'];

  var produto = {
    id: pid || (100000 + Date.now()),
    name: name,
    cat: cat,
    catLabel: catLabel,
    sub: document.getElementById('np-sub').value,
    desc: document.getElementById('np-desc').value.trim(),
    emoji: imgs[0],
    imgs: imgs,
    price: price,
    oldPrice: parseFloat(document.getElementById('np-old').value) || 0,
    discount: parseInt(document.getElementById('np-disc').value,10) || 0,
    stock: stock,
    sold: pid ? (ALL_PRODUCTS.find(function(x){return x.id===pid;})||{}).sold||0 : 0,
    rating: pid ? (ALL_PRODUCTS.find(function(x){return x.id===pid;})||{}).rating||'5.0' : '5.0',
    atacado: document.getElementById('np-atacado').checked,
    installment: price > 100 ? Math.ceil(price/12) : 0,
    ncm: ncm,
    cst: document.getElementById('np-cst').value,
    cfop: document.getElementById('np-cfop').value,
    origem: 0,
    icms: parseFloat(document.getElementById('np-icms').value) || 0,
    ipi: parseFloat(document.getElementById('np-ipi').value) || 0,
    pis: 0, cofins: 0,
    icmsST: document.getElementById('np-st').checked,
    cargaIbpt: parseFloat(document.getElementById('np-ibpt').value) || 6,
    custom: true
  };

  // Atualiza ou insere no ALL_PRODUCTS
  var idx = ALL_PRODUCTS.findIndex(function(x){return x.id===produto.id;});
  if (idx >= 0) ALL_PRODUCTS[idx] = produto;
  else ALL_PRODUCTS.unshift(produto);

  saveCustomProduct(produto);
  closeModal();
  toast(pid ? '✅ Produto atualizado!' : '✅ Produto cadastrado!','success');
  render();
}

function confirmarExcluirProduto(pid) {
  var p = ALL_PRODUCTS.find(function(x){return x.id===pid;});
  if (!p) return;
  if (!confirm('Excluir "'+p.name+'"?\n\nEssa ação não pode ser desfeita.')) return;
  deleteCustomProduct(pid);
  ALL_PRODUCTS = ALL_PRODUCTS.filter(function(x){return x.id!==pid;});
  closeModal();
  toast('🗑 Produto excluído','success');
  render();
}

function _vendMockClientes(seedId) {
  var nomes = [
    {n:'Construtora ABC LTDA', t:'CNPJ', d:'12.345.678/0001-90'},
    {n:'João da Silva',         t:'CPF',  d:'123.456.789-00'},

    {n:'Maria Souza',           t:'CPF',  d:'987.654.321-00'},
    {n:'Engenharia & Cia',      t:'CNPJ', d:'56.789.012/0001-34'},
    {n:'Pedro Henrique',        t:'CPF',  d:'456.789.012-34'},
    {n:'Empreiteira Oeste',     t:'CNPJ', d:'67.890.123/0001-45'},
    {n:'Ana Carolina',          t:'CPF',  d:'789.012.345-67'},
    {n:'Solar Brasil ME',       t:'CNPJ', d:'78.901.234/0001-56'},
    {n:'Carlos Almeida',        t:'CPF',  d:'234.567.890-12'}
  ];
  // Mistura baseada no seedId pra dar variedade
  return nomes.map(function(c, i){
    return Object.assign({}, c, {
      vendas: Math.floor((seedId*37 + i*13) % 12) + 1,
      valor: Math.round(((seedId*97 + i*53) % 8000 + 1500) * 100)/100
    });
  }).sort(function(a,b){return b.valor - a.valor;});
}
function _vendMockProdutos(seedId) {
  var pool = ALL_PRODUCTS.slice(0, 30);
  return pool
    .map(function(p,i){ return {p:p, qtd: Math.floor((seedId*31 + i*17) % 20) + 1}; })
    .sort(function(a,b){return b.qtd - a.qtd;})
    .slice(0, 5);
}

function renderAdminBuscasPerdidas() {
  var todas = loadBuscasPerdidas();
  var pendentes = todas.filter(function(b){ return !b.atendido && !b.ignorado; });
  var atendidas = todas.filter(function(b){ return b.atendido; });
  var ignoradas = todas.filter(function(b){ return b.ignorado; });
  var totalBuscas = todas.reduce(function(s,b){ return s+b.count; }, 0);

  // Ranking ordenado por demanda (count desc)
  pendentes.sort(function(a,b){ return b.count - a.count; });

  // Top 7 dias
  var seteDias = Date.now() - 7*24*60*60*1000;
  var ultimaSemana = pendentes.filter(function(b){ return new Date(b.lastAt).getTime() >= seteDias; });

  var h = '<div class="admin-header"><h2>🔍 Buscas Perdidas</h2><span style="font-size:13px;color:var(--gray-400)">O que o cliente procurou e não encontrou — sua próxima compra de fornecedor</span></div>';

  // KPIs
  h += '<div class="stat-grid">';
  h += '<div class="stat-card"><div class="stat-label">Termos Únicos</div><div class="stat-value">' + pendentes.length + '</div><div class="stat-change">aguardando atendimento</div></div>';
  h += '<div class="stat-card"><div class="stat-label">Total de Buscas</div><div class="stat-value">' + totalBuscas + '</div><div class="stat-change up">demanda acumulada</div></div>';
  h += '<div class="stat-card"><div class="stat-label">Últimos 7 dias</div><div class="stat-value" style="color:var(--orange)">' + ultimaSemana.length + '</div><div class="stat-change">termos quentes</div></div>';
  h += '<div class="stat-card"><div class="stat-label">Já Atendidos</div><div class="stat-value" style="color:var(--green)">' + atendidas.length + '</div><div class="stat-change">produtos cadastrados</div></div>';
  h += '</div>';

  // Alerta comercial
  if (pendentes.length > 0) {
    var top = pendentes[0];
    h += '<div style="background:linear-gradient(135deg,#fff7ed,#fed7aa);border:1px solid #fdba74;border-radius:12px;padding:16px 20px;margin-bottom:20px;display:flex;align-items:center;gap:14px">';
    h += '<div style="font-size:32px">💡</div>';
    h += '<div style="flex:1"><div style="font-size:13px;font-weight:800;color:#9a3412">Oportunidade comercial detectada</div>';
    h += '<div style="font-size:12px;color:#7c2d12;margin-top:2px">O termo mais buscado é <strong>"' + escHtml(top.qOriginal) + '"</strong> com <strong>' + top.count + '</strong> busca(s). Considere comprar do fornecedor.</div></div>';
    h += '<button class="btn btn-orange btn-sm" onclick="exportarBuscasCsv()">📊 Exportar CSV</button>';
    h += '</div>';
  }

  // Toolbar
  h += '<div style="display:flex;gap:10px;align-items:center;margin-bottom:14px">';
  h += '<div style="font-size:13px;font-weight:700;color:var(--gray-700)">Ranking por demanda</div>';
  h += '<div style="margin-left:auto;display:flex;gap:8px">';
  if (pendentes.length > 0) h += '<button class="btn btn-outline btn-sm" onclick="exportarBuscasCsv()">📊 Exportar CSV</button>';
  if (todas.length > 0) h += '<button class="btn btn-outline btn-sm" style="color:var(--red);border-color:var(--red)" onclick="limparBuscasPerdidas()">🗑 Limpar tudo</button>';
  h += '</div></div>';

  // Tabela
  if (pendentes.length === 0) {
    h += '<div style="padding:60px 20px;text-align:center;color:var(--gray-400);background:#fff;border-radius:12px;border:1px solid var(--gray-100)">';
    h += '<div style="font-size:48px;margin-bottom:12px">✨</div>';
    h += '<h3 style="font-size:16px;color:var(--gray-700);margin-bottom:6px">Sem buscas perdidas</h3>';
    h += '<p style="font-size:13px">Quando algum cliente buscar algo que não tem no catálogo, aparece aqui automaticamente.</p>';
    h += '</div>';
  } else {
    h += '<table class="data-table"><thead><tr>';
    h += '<th style="width:50px">#</th><th>Termo Buscado</th><th>Vezes</th><th>Primeira</th><th>Última</th><th>Interessados</th><th style="text-align:right">Ações</th>';
    h += '</tr></thead><tbody>';
    pendentes.forEach(function(b, i){
      var diasDesde = Math.floor((Date.now() - new Date(b.lastAt).getTime()) / (1000*60*60*24));
      var ranking = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i+1);
      var calor = b.count >= 5 ? '🔥' : b.count >= 3 ? '⚡' : '';
      h += '<tr>';
      h += '<td style="font-size:16px;font-weight:700;text-align:center">' + ranking + '</td>';
      h += '<td><strong style="font-size:14px">' + escHtml(b.qOriginal) + '</strong> ' + calor + '</td>';
      h += '<td><span style="display:inline-block;min-width:32px;padding:3px 8px;background:' + (b.count>=5?'var(--red)':b.count>=3?'var(--orange)':'var(--blue)') + ';color:#fff;border-radius:20px;font-size:12px;font-weight:800;text-align:center">' + b.count + '</span></td>';
      h += '<td style="font-size:11px;color:var(--gray-500)">' + new Date(b.firstAt).toLocaleDateString('pt-BR') + '</td>';
      h += '<td style="font-size:11px;color:var(--gray-500)">' + (diasDesde === 0 ? 'hoje' : diasDesde === 1 ? 'ontem' : 'há ' + diasDesde + ' dias') + '</td>';
      // Interessados — mostra avatares + nome do primeiro
      var contatosNorm = (b.contatos||[]).map(_normalizarContato).filter(Boolean);
      var temCadastrados = contatosNorm.length > 0;
      if (temCadastrados) {
        var primeiro = contatosNorm[0];
        h += '<td style="font-size:11px">';
        h += '<div style="display:flex;align-items:center;gap:6px"><div style="width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800">' + escHtml((primeiro.nome||'?').split(' ').map(function(x){return x[0];}).slice(0,2).join('').toUpperCase()) + '</div>';
        h += '<div><div style="font-size:11px;font-weight:700;color:var(--gray-700)">' + escHtml(primeiro.nome||'Cliente') + '</div>';
        h += '<div style="font-size:10px;color:var(--gray-500)">' + (contatosNorm.length>1 ? '+' + (contatosNorm.length-1) + ' outro(s)' : escHtml(primeiro.doc||'')) + '</div></div></div>';
        h += '</td>';
      } else {
        h += '<td style="font-size:11px;color:var(--gray-400)">— anônimo</td>';
      }
      h += '<td style="text-align:right"><div style="display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap">';
      if (temCadastrados) {
        h += '<button class="btn btn-sm" style="background:#25D366;color:#fff;border:0" onclick="abrirContatosBusca(\'' + b.q.replace(/'/g,"\\'") + '\')" title="Contatar clientes interessados por WhatsApp">💬 WhatsApp</button>';
      }
      h += '<button class="btn btn-outline btn-sm" style="color:var(--green);border-color:var(--green)" onclick="marcarBuscaAtendida(\'' + b.q.replace(/'/g,"\\'") + '\')" title="Já cadastrei esse produto">✓ Atendido</button>';
      h += '<button class="btn btn-outline btn-sm" onclick="ignorarBusca(\'' + b.q.replace(/'/g,"\\'") + '\')" title="Não vou cadastrar">✕ Ignorar</button>';
      h += '</div></td>';
      h += '</tr>';
    });
    h += '</tbody></table>';
  }

  // Histórico (atendidos + ignorados)
  if (atendidas.length > 0 || ignoradas.length > 0) {
    h += '<div style="margin-top:30px"><h3 style="font-size:14px;font-weight:700;color:var(--gray-700);margin-bottom:12px">Histórico</h3>';
    h += '<table class="data-table"><thead><tr><th>Termo</th><th>Vezes</th><th>Status</th><th style="text-align:right">Ação</th></tr></thead><tbody>';
    atendidas.concat(ignoradas).forEach(function(b){
      var statusPill = b.atendido
        ? '<span style="background:#d1fae5;color:#065f46;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700">✓ Atendido</span>'
        : '<span style="background:#f3f4f6;color:#6b7280;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700">Ignorado</span>';
      h += '<tr>';
      h += '<td>' + escHtml(b.qOriginal) + '</td>';
      h += '<td>' + b.count + '</td>';
      h += '<td>' + statusPill + '</td>';
      h += '<td style="text-align:right"><button class="btn btn-outline btn-sm" onclick="reativarBusca(\'' + b.q.replace(/'/g,"\\'") + '\')">↩ Reativar</button> <button class="btn btn-outline btn-sm" style="color:var(--red);border-color:var(--red)" onclick="excluirBusca(\'' + b.q.replace(/'/g,"\\'") + '\')">🗑</button></td>';
      h += '</tr>';
    });
    h += '</tbody></table></div>';
  }

  return h;
}

function gerarCodigoIndicacao(nome) {
  var primeiro = (nome || 'CLIENTE').split(' ')[0].toUpperCase().replace(/[^A-Z]/g,'');
  var hash = 0;
  for (var i = 0; i < (nome || '').length; i++) hash = ((hash << 5) - hash) + nome.charCodeAt(i);
  var num = Math.abs(hash) % 900 + 100;
  return primeiro + '-' + num;
}

function copiarTexto(txt) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(txt).then(function(){ alert('Copiado: ' + txt); });
  } else {
    var ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    alert('Copiado: ' + txt);
  }
}

function aplicarCupom() {
  var input = document.getElementById('cupom-input');
  if (!input) return;
  var codigo = input.value.toUpperCase().trim();
  state.cupomErro = '';
  if (!codigo) { state.cupomErro = 'Digite um código de cupom'; render(); return; }

  var cupom = CUPONS.find(function(c){return c.codigo === codigo;});
  if (!cupom) { state.cupomErro = 'Cupom inválido ou expirado'; render(); return; }
  if (!cupom.ativo) { state.cupomErro = 'Este cupom não está ativo'; render(); return; }

  var subtotal = state.cart.reduce(function(s,i){var p=ALL_PRODUCTS.find(function(x){return x.id===i.pid;});return s+(p?p.price*i.qty:0);},0);
  if (subtotal < cupom.minimo) { state.cupomErro = 'Valor mínimo de R$ ' + formatMoney(cupom.minimo) + ' não atingido'; render(); return; }

  state.cupomAplicado = cupom;
  state.cupomErro = '';
  render();
}

function removerCupom() { state.cupomAplicado = null; state.cupomErro = ''; render(); }

function toggleCupom(idx) { CUPONS[idx].ativo = !CUPONS[idx].ativo; render(); }
function excluirCupom(idx) { if (confirm('Excluir cupom ' + CUPONS[idx].codigo + '?')) { CUPONS.splice(idx,1); render(); } }
function abrirCupomNovo() {
  var cod = prompt('Código do cupom (ex: PROMO20):'); if (!cod) return;
  var tipo = prompt('Tipo: digite "percent" (% off) ou "fixed" (R$ off):', 'percent'); if (!tipo) return;
  var valor = parseFloat(prompt(tipo==='percent'?'% de desconto:':'R$ de desconto:'));
  var minimo = parseFloat(prompt('Valor mínimo de compra (R$):', '50') || '50');
  var validade = prompt('Validade (DD/MM/AAAA):', '31/12/2026');
  var desc = prompt('Descrição curta:', 'Cupom promocional');
  CUPONS.unshift({ codigo: cod.toUpperCase(), tipo: tipo, valor: valor, validade: validade, minimo: minimo, usos: 0, ativo: true, desc: desc });
  render();
}

function confirmarReposicao(pid) {
  var p = ALL_PRODUCTS.find(function(x){return x.id===pid;});
  if (!p) return;
  var qtd = parseInt(document.getElementById('rep-qtd').value);
  if (!qtd || qtd <= 0) { toast('Faltou informar a quantidade.', 'warn'); return; }
  var dataRec = document.getElementById('rep-data-rec').value;
  if (!dataRec) { toast('Faltou informar a data de recebimento.', 'warn'); return; }
  var rep = {
    pid: pid,
    produto: p.name,
    qtd: qtd,
    un: document.getElementById('rep-un').value,
    dataRec: dataRec,
    dataVal: document.getElementById('rep-data-val').value || null,
    lote: document.getElementById('rep-lote').value || '',
    custo: parseFloat(document.getElementById('rep-custo').value) || 0,
    fornecedor: document.getElementById('rep-forn').value || '',
    obs: document.getElementById('rep-obs').value || '',
    nfData: document.getElementById('rep-nf-data').value || '',
    nfName: document.getElementById('rep-nf-name').value || '',
    nfType: document.getElementById('rep-nf-type').value || '',
    estoqueAntes: p.stock,
    estoqueDepois: p.stock + qtd
  };
  state.reposicoes.unshift(rep);
  p.stock += qtd;
  closeModal();
  var msg = '✅ Entrada registrada!\n\n';
  msg += '📦 ' + p.name + '\n';
  msg += '➕ ' + qtd + ' ' + rep.un + ' (' + rep.estoqueAntes + ' → ' + rep.estoqueDepois + ')\n';
  msg += '📅 Recebido em ' + new Date(dataRec).toLocaleDateString('pt-BR') + '\n';
  if (rep.dataVal) msg += '⏳ Vence em ' + new Date(rep.dataVal).toLocaleDateString('pt-BR') + '\n';
  if (rep.lote) msg += '🏷️ Lote: ' + rep.lote + '\n';
  if (rep.fornecedor) msg += '🏢 Fornecedor: ' + rep.fornecedor;
  if (rep.nfName) msg += '\n📎 NF anexada: ' + rep.nfName;
  alert(msg);
  render();
}

function anexarNfReposicao(ev) {
  var file = ev.target.files[0];
  if (!file) return;
  if (file.size > 3*1024*1024) { toast('Arquivo muito grande (máx 3MB).','warn'); ev.target.value=''; return; }
  var reader = new FileReader();
  reader.onload = function(e) {
    var dataUrl = e.target.result;
    document.getElementById('rep-nf-data').value = dataUrl;
    document.getElementById('rep-nf-name').value = file.name;
    document.getElementById('rep-nf-type').value = file.type;
    document.getElementById('rep-nf-empty').style.display = 'none';
    var prev = document.getElementById('rep-nf-preview');
    prev.style.display = 'block';
    var icon = file.type === 'application/pdf' ? '📕' : '🖼️';
    var sizeKb = (file.size/1024).toFixed(0);
    prev.innerHTML = '<div style="display:flex;align-items:center;gap:10px;padding:8px;background:#fff;border:1px solid var(--gray-200);border-radius:6px;text-align:left">'
      + '<div style="font-size:28px">'+icon+'</div>'
      + '<div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+escHtml(file.name)+'</div>'
      + '<div style="font-size:10px;color:var(--gray-500)">'+sizeKb+' KB · anexada</div></div>'
      + '<button type="button" class="btn btn-outline btn-sm" onclick="visualizarNfAnexada()" title="Visualizar">👁</button>'
      + '<button type="button" class="btn btn-outline btn-sm" onclick="removerNfAnexada()" title="Remover" style="color:var(--red);border-color:var(--red)">✕</button>'
      + '</div>';
  };
  reader.readAsDataURL(file);
}
function removerNfAnexada() {
  document.getElementById('rep-nf-data').value = '';
  document.getElementById('rep-nf-name').value = '';
  document.getElementById('rep-nf-type').value = '';
  document.getElementById('rep-nf-file').value = '';
  document.getElementById('rep-nf-empty').style.display = 'block';
  document.getElementById('rep-nf-preview').style.display = 'none';
}
function visualizarNfAnexada() {
  var url = document.getElementById('rep-nf-data').value;
  if (!url) return;
  var w = window.open();
  if (!w) { toast('Bloqueio de pop-up. Libere pra visualizar.','warn'); return; }
  w.document.write('<title>NF anexada</title><iframe src="'+url+'" style="border:0;width:100%;height:100vh"></iframe>');
}

  return s==='ativo' ? {bg:'#d1fae5',fg:'#065f46'}

}

  return {ativo:'Ativo',inativo:'Inativo',avaliacao:'Em avaliação',bloqueado:'Bloqueado'}[s]||s;

  var overlay = document.getElementById('modal-overlay');
  var content = document.getElementById('modal-content');

  h += '<button class="modal-close" onclick="closeModal()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>';
  h += '<div class="modal-body">';

  // Identificação

function salvarFornecedor(id) {
  var razao = document.getElementById('fn-razao').value.trim();
  var cnpj = document.getElementById('fn-cnpj').value.trim();
  if (!razao) { toast('Razão social é obrigatória.','warn'); return; }
  if (!cnpj) { toast('CNPJ é obrigatório.','warn'); return; }
  var lista = loadFornecedores();
  var existing = id ? lista.find(function(x){return x.id===id;}) : null;
  var f = existing || {id: 'forn_' + Date.now(), criadoEm: new Date().toISOString()};
  f.razao = razao;
  f.fantasia = document.getElementById('fn-fantasia').value.trim();

  f.ie = document.getElementById('fn-ie').value.trim();
  f.status = document.getElementById('fn-status').value;
  f.contatoNome = document.getElementById('fn-contato').value.trim();
  f.contatoCargo = document.getElementById('fn-cargo').value.trim();
  f.telefone = document.getElementById('fn-tel').value.trim();
  f.email = document.getElementById('fn-email').value.trim();
  f.site = document.getElementById('fn-site').value.trim();
  f.cep = document.getElementById('fn-cep').value.trim();
  f.endereco = document.getElementById('fn-endereco').value.trim();
  f.cidade = document.getElementById('fn-cidade').value.trim();
  f.uf = document.getElementById('fn-uf').value.trim().toUpperCase();
  f.categoria = document.getElementById('fn-cat').value;
  f.prazo = parseInt(document.getElementById('fn-prazo').value,10) || 30;

  saveFornecedores(lista);

  toast(existing?'✅ Fornecedor atualizado':'✅ Fornecedor cadastrado','success');

}

function excluirFornecedor(id) {
  var lista = loadFornecedores();
  var f = lista.find(function(x){return x.id===id;});

  if (!confirm('Excluir o fornecedor "'+f.razao+'"?\n\nEssa ação não pode ser desfeita.')) return;

  toast('🗑 Fornecedor excluído','success');
  render();
}

function loadBuscasPerdidas() {
  try { return JSON.parse(localStorage.getItem('zm_buscas_perdidas') || '[]'); }
  catch(e) { return []; }
}
function saveBuscasPerdidas(list) {
  try { localStorage.setItem('zm_buscas_perdidas', JSON.stringify(list)); }
  catch(e) {}
}
function registrarBuscaPerdida(query) {
  if (!query || query.trim().length < 2) return;
  // Normaliza pra agrupar variações: lowercase + remove acento + trim
  var norm = query.trim().toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/\s+/g,' ');
  var list = loadBuscasPerdidas();
  var existing = list.find(function(b){ return b.q === norm; });
  // Monta objeto de contato rico se o usuário estiver logado
  var contato = null;
  if (state.logged && state.user && state.user.telefone) {
    contato = {
      nome: state.user.nome || 'Cliente',
      telefone: state.user.telefone,
      doc: state.user.doc || '',
      email: state.user.email || '',
      tipo: state.user.tipo || 'pf',
      when: new Date().toISOString()
    };
  }
  if (existing) {
    existing.count++;
    existing.lastAt = new Date().toISOString();
    if (contato) {
      existing.contatos = existing.contatos || [];
      // Dedup por telefone (suporta formato antigo string)
      var jaTem = existing.contatos.some(function(c){
        if (typeof c === 'string') return c === contato.telefone;
        return c.telefone === contato.telefone;
      });
      if (!jaTem && existing.contatos.length < 20) {
        existing.contatos.push(contato);
      }
    }
  } else {
    list.push({
      q: norm,
      qOriginal: query.trim(),
      count: 1,
      firstAt: new Date().toISOString(),
      lastAt: new Date().toISOString(),
      atendido: false,
      ignorado: false,
      contatos: contato ? [contato] : []
    });
  }
  saveBuscasPerdidas(list);
}

// Normaliza contato (suporta formato antigo: string telefone) → sempre retorna objeto
function _normalizarContato(c) {
  if (!c) return null;
  if (typeof c === 'string') return { nome: 'Cliente anônimo', telefone: c, doc: '', email: '', tipo: 'pf', when: null };
  return c;
}
function _formatTelMostrar(tel) {
  if (!tel) return '';
  return String(tel).replace(/[^\d+]/g,'').replace(/^(\+?\d{2})?(\d{2})(\d{4,5})(\d{4})$/, function(_,p,d,a,b){ return (p?p+' ':'')+'('+d+') '+a+'-'+b; });
}
function _whatsappLink(tel, termo) {
  var n = String(tel).replace(/[^\d]/g,'');
  if (n.length === 11 || n.length === 10) n = '55' + n; // adiciona DDI Brasil
  var msg = encodeURIComponent('Olá! Aqui é da *ZM Atacadista*. Você procurou por *"' + termo + '"* em nosso site e nós já temos esse produto disponível pra você. Posso te enviar mais informações?');
  return 'https://wa.me/' + n + '?text=' + msg;
}

function marcarBuscaAtendida(q) {
  var list = loadBuscasPerdidas();

  if (b) { b.atendido = true; b.atendidoEm = new Date().toISOString(); saveBuscasPerdidas(list); render(); toast('Marcada como atendida — o cliente verá o produto na próxima busca', 'success'); }
}
function ignorarBusca(q) {
  var list = loadBuscasPerdidas();
  var b = list.find(function(x){ return x.q === q; });
  if (b) { b.ignorado = true; saveBuscasPerdidas(list); render(); }
}
function reativarBusca(q) {
  var list = loadBuscasPerdidas();
  var b = list.find(function(x){ return x.q === q; });
  if (b) { b.ignorado = false; b.atendido = false; saveBuscasPerdidas(list); render(); }

function excluirBusca(q) {

function limparBuscasPerdidas() {
  if (!confirm('Apagar TODO o histórico de buscas perdidas? Não dá pra desfazer.')) return;

  toast('Histórico limpo', 'success');
}
function exportarBuscasCsv() {
  var list = loadBuscasPerdidas().filter(function(b){ return !b.ignorado; });
  list.sort(function(a,b){ return b.count - a.count; });
  var csv = 'Termo Buscado,Vezes,Primeira Busca,Última Busca,Status,Contatos Interessados\n';
  list.forEach(function(b){
    var status = b.atendido ? 'Atendido' : 'Pendente';
    var contatos = (b.contatos || []).join('; ');
    csv += '"' + b.qOriginal.replace(/"/g,'""') + '",' + b.count + ',' +
      new Date(b.firstAt).toLocaleDateString('pt-BR') + ',' +
      new Date(b.lastAt).toLocaleDateString('pt-BR') + ',' +
      status + ',"' + contatos + '"\n';
  });
  var blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'zm_buscas_perdidas_' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
  toast('CSV exportado — abra no Excel', 'success');
}

function addToCart(pid) {
  var existing = state.cart.find(function(i){return i.pid===pid;});
  if (existing) existing.qty++;
  else state.cart.push({pid:pid, qty:1});
  var p = ALL_PRODUCTS.find(function(x){return x.id===pid;});
  if (p && p.stock > 0) p.stock--;
  render();
}
function changeQty(idx, delta) {
  state.cart[idx].qty += delta;
  var p = ALL_PRODUCTS.find(function(x){return x.id===state.cart[idx].pid;});
  if (delta > 0 && p) p.stock--;
  if (delta < 0 && p) p.stock++;
  if (state.cart[idx].qty <= 0) state.cart.splice(idx, 1);
  render();
}
function removeFromCart(idx) {
  var item = state.cart[idx];
  var p = ALL_PRODUCTS.find(function(x){return x.id===item.pid;});
  if (p) p.stock += item.qty;
  state.cart.splice(idx, 1);
  render();
}

}

  } else {
    endereco = { cep: val('end-cep-pj'), rua: val('end-rua-pj'), numero: val('end-num-pj'), complemento: val('end-comp-pj'), bairro: val('end-bairro-pj'), cidade: val('end-cidade-pj'), uf: val('end-uf-pj') };
    state.user = {
      nome: val('login-resp') || 'Construtora ABC',
      razao: val('login-razao') || 'Construtora ABC LTDA',
      doc: val('login-cnpj') || '12.345.678/0001-90',
      ie: val('login-ie') || '702.123.456',
      email: val('login-email-pj') || 'contato@abc.com',
      telefone: val('login-tel-pj') || '(11) 99999-0000',
      endereco: endereco,
      tipo: 'pj',
      cashback: 846.20,
      cashbackMesAtual: 92.40,
      cashbackTotalAcumulado: 1247.80
    };
  }
  // Pré-preenche o CEP do checkout com o cadastrado
  if (endereco.cep) state.frete.cep = endereco.cep.replace(/\D/g,'');
  state.cashbackHistory = [
    {data:'04/05/2026', tipo:'in', desc:'Crédito do pedido #1043', valor: state.user.cashback * 0.4},
    {data:'28/04/2026', tipo:'in', desc:'Crédito do pedido #1031', valor: state.user.cashback * 0.35},
    {data:'15/04/2026', tipo:'in', desc:'Crédito do pedido #1018', valor: state.user.cashback * 0.25}
  ];
  state.logged = true;
  closeModal();
  render();
}
function finalizarPedido() {
  if (!state.logged) { openModal('login'); return; }
  if (!state.frete.calculado || !state.frete.opcao) { toast('Calcule o frete antes de finalizar o pedido — é só preencher o CEP.', 'warn'); return; }
  var subtotal = state.cart.reduce(function(s,i){var p=ALL_PRODUCTS.find(function(x){return x.id===i.pid;});return s+(p?p.price*i.qty:0);},0);
  var frete = state.frete.valor;
  var descontoCupom = 0;
  if (state.cupomAplicado) {
    var cup = state.cupomAplicado;
    if (cup.tipo === 'percent') descontoCupom = subtotal * (cup.valor/100);
    else if (cup.tipo === 'fixed') descontoCupom = cup.valor;
    else if (cup.tipo === 'frete') frete = 0;
    cup.usos = (cup.usos || 0) + 1;
  }
  var saldoCb = state.user.cashback || 0;
  var cashbackUso = state.useCashback ? Math.min(saldoCb, subtotal - descontoCupom) : 0;
  var totalSemCb = subtotal + frete - descontoCupom - cashbackUso;
  var total = state.checkoutPay === 'pix' ? totalSemCb * 0.95 : totalSemCb;

  // CASHBACK COM LIMITE POR CPF
  var cashbackGanho = 0;
  if (subtotal >= CASHBACK_CONFIG.valorMinimoCompra) {
    var ganhoBruto = subtotal * CASHBACK_CONFIG.pct;
    var disponivelMes = Math.max(0, CASHBACK_CONFIG.limiteMensalCpf - (state.user.cashbackMesAtual || 0));
    var disponivelAcum = Math.max(0, CASHBACK_CONFIG.limiteAcumuladoCpf - (state.user.cashbackTotalAcumulado || 0));
    cashbackGanho = Math.min(ganhoBruto, disponivelMes, disponivelAcum);
    state.user.cashbackMesAtual = (state.user.cashbackMesAtual || 0) + cashbackGanho;
    state.user.cashbackTotalAcumulado = (state.user.cashbackTotalAcumulado || 0) + cashbackGanho;
  }
  var opNome = {sedex:'SEDEX',pac:'PAC',expresso:'SEDEX 10'};

  // Atribui vendedor (rotativo, exclui Diego — Júnior só atende presencial nessa demo)
  var vendedoresAtivos = VENDEDORES.slice(0, 6);
  var vendedor = vendedoresAtivos[state.orders.length % vendedoresAtivos.length];
  vendedor.vendas += total;
  vendedor.pedidos += 1;

  var orderId = 1048 + state.orders.length;
  var order = {
    id: orderId,
    date: new Date().toLocaleDateString('pt-BR'),
    items: state.cart.map(function(i){var p=ALL_PRODUCTS.find(function(x){return x.id===i.pid;});return{name:p?p.name:'',qty:i.qty,price:p?p.price:0};}),
    total: total,
    subtotal: subtotal,
    frete: frete,
    cashbackUsado: cashbackUso,
    cashbackGanho: cashbackGanho,
    vendedor: vendedor.nome,
    vendedorId: vendedor.id,
    freteModalidade: opNome[state.frete.opcao] || state.frete.opcao,
    fretePrazo: state.frete.prazo,
    pay: state.checkoutPay === 'pix' ? 'Pix' : state.checkoutPay === 'cartao' ? 'Cartão' : 'Boleto',
    status: 'Processando',
    statusClass: 'status-blue',
    cliente: state.user.nome
  };

  // Atualiza saldo de cashback do user
  state.user.cashback = saldoCb - cashbackUso + cashbackGanho;
  if (cashbackUso > 0) {
    state.cashbackHistory.unshift({data:order.date, tipo:'out', desc:'Resgate no pedido #' + orderId, valor: cashbackUso});
  }
  state.cashbackHistory.unshift({data:order.date, tipo:'in', desc:'Crédito do pedido #' + orderId, valor: cashbackGanho});

  order.cupomCodigo = state.cupomAplicado ? state.cupomAplicado.codigo : null;
  order.descontoCupom = descontoCupom;
  state.orders.push(order);
  state.cart = [];
  state.frete = { cep: '', opcao: '', valor: 0, prazo: '', calculado: false };
  state.useCashback = false;
  state.cupomAplicado = null;
  state.cupomErro = '';
  state.view = 'client';
  state.clientView = 'pedidos';
  render();
  // Modal de confirmação amigável com link de acompanhamento por WhatsApp
  var waMsg = encodeURIComponent('Olá! Acabei de fazer o pedido #' + order.id + ' na ZM Atacadista. Gostaria de acompanhar o andamento.');
  var waLink = 'https://wa.me/5534984282779?text=' + waMsg;
  var modal = document.createElement('div');
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,0.7);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px';
  modal.innerHTML =
    '<div style="background:#fff;border-radius:18px;padding:32px 28px;max-width:440px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.3)">' +
      '<div style="font-size:64px;margin-bottom:12px">✅</div>' +
      '<h2 style="font-size:22px;font-weight:800;color:#0f172a;margin-bottom:6px">Pedido confirmado!</h2>' +
      '<p style="font-size:14px;color:#64748b;margin-bottom:18px">Pedido #<strong>' + order.id + '</strong></p>' +
      '<div style="background:#f8fafc;border-radius:12px;padding:14px;text-align:left;font-size:13px;color:#334155;margin-bottom:20px;line-height:1.7">' +
        '<div>💰 <strong>Total:</strong> R$ ' + formatMoney(order.total) + '</div>' +
        '<div>💳 <strong>Pagamento:</strong> ' + order.pay + '</div>' +
        '<div>🚚 <strong>Entrega:</strong> ' + order.freteModalidade + ' — ' + order.fretePrazo + '</div>' +
        '<div>👤 <strong>Atendido por:</strong> ' + vendedor.nome + '</div>' +
        (cashbackGanho > 0 ? '<div style="color:#10b981;margin-top:6px">🎁 <strong>+R$ ' + formatMoney(cashbackGanho) + '</strong> de cashback ganho</div>' : '') +
      '</div>' +
      '<a href="' + waLink + '" target="_blank" style="display:block;background:#25D366;color:#fff;padding:14px;border-radius:10px;font-size:15px;font-weight:700;text-decoration:none;margin-bottom:10px">💬 Acompanhar pelo WhatsApp</a>' +
      '<button onclick="this.closest(\'[style*=fixed]\').remove()" style="background:transparent;color:#64748b;font-size:13px;border:none;cursor:pointer;padding:8px">Fechar</button>' +
    '</div>';
  document.body.appendChild(modal);
  modal.onclick = function(e){ if(e.target === modal) modal.remove(); };
}

function formatMoney(v) { return Number(v).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function escHtml(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// =============================================
// FRETE — SIMULAÇÃO CORREIOS
// =============================================
var FRETE_CACHE = {};

function calcularFrete(cepInput, callback) {
  var cep = (cepInput || '').replace(/\D/g, '');
  if (cep.length !== 8) { toast('CEP inválido. Digite os 8 números (sem traço).', 'warn'); return; }

  if (FRETE_CACHE[cep]) { callback(FRETE_CACHE[cep]); return; }

  var btn = document.getElementById('btn-calc-frete');
  if (btn) { btn.textContent = 'Calculando...'; btn.disabled = true; }

  fetch('https://viacep.com.br/ws/' + cep + '/json/')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.erro) { toast('CEP não encontrado. Confira os números e tente de novo.', 'error'); resetFreteBtn(); return; }

      var subtotal = state.cart.reduce(function(s,i){var p=ALL_PRODUCTS.find(function(x){return x.id===i.pid;});return s+(p?p.price*i.qty:0);},0);
      var totalItens = state.cart.reduce(function(s,i){return s+i.qty;},0);
      var peso = Math.max(0.3, totalItens * 0.5);

      var dist = calcDistanciaPorUF(data.uf);
      var baseSedex = 15.90 + (dist * 1.8) + (peso * 2.5);
      var basePAC = 12.50 + (dist * 0.9) + (peso * 1.5);
      var baseExpresso = 28.90 + (dist * 2.8) + (peso * 3.2);

      baseSedex = Math.round(baseSedex * 100) / 100;
      basePAC = Math.round(basePAC * 100) / 100;
      baseExpresso = Math.round(baseExpresso * 100) / 100;

      var freteGratis = subtotal >= 299;
      var prazoBase = Math.max(1, Math.round(dist / 3));

      var resultado = {
        cep: cep,
        endereco: data.logradouro ? (data.logradouro + ', ' + data.bairro + ' — ' + data.localidade + '/' + data.uf) : (data.localidade + '/' + data.uf),
        cidade: data.localidade,
        uf: data.uf,
        opcoes: [
          { id: 'sedex', nome: 'SEDEX', prazo: prazoBase + ' a ' + (prazoBase + 2) + ' dias úteis', valor: freteGratis ? 0 : baseSedex, icon: '📦' },
          { id: 'pac', nome: 'PAC — Encomenda', prazo: (prazoBase + 3) + ' a ' + (prazoBase + 7) + ' dias úteis', valor: freteGratis ? 0 : basePAC, icon: '📬' },
          { id: 'expresso', nome: 'SEDEX 10 — Expressa', prazo: prazoBase <= 1 ? '1 dia útil' : '1 a ' + prazoBase + ' dias úteis', valor: freteGratis ? 0 : baseExpresso, icon: '⚡' }
        ]
      };

      FRETE_CACHE[cep] = resultado;
      callback(resultado);
      resetFreteBtn();
    })
    .catch(function() {
      var resultado = freteSimuladoFallback(cep);
      FRETE_CACHE[cep] = resultado;
      callback(resultado);
      resetFreteBtn();
    });
}

function calcDistanciaPorUF(uf) {
  var distancias = {
    'MG':0,'SP':2,'RJ':3,'ES':2,'GO':1,'DF':2,'MS':3,'MT':4,
    'BA':4,'SE':5,'AL':5,'PE':6,'PB':6,'RN':6,'CE':7,'PI':7,'MA':8,
    'PA':9,'AP':10,'AM':10,'RR':11,'AC':11,'RO':8,'TO':5,
    'PR':3,'SC':4,'RS':5
  };
  return distancias[uf] || 5;
}

function freteSimuladoFallback(cep) {
  var region = parseInt(cep.charAt(0));
  var dist = [0,3,4,5,2,4,6,7,8,1][region] || 5;
  return {
    cep: cep,
    endereco: 'CEP ' + cep.replace(/(\d{5})(\d{3})/, '$1-$2'),
    cidade: '',
    uf: '',
    opcoes: [
      { id: 'sedex', nome: 'SEDEX', prazo: (dist+1) + ' a ' + (dist+3) + ' dias úteis', valor: Math.round((15.90 + dist*1.8)*100)/100, icon: '📦' },
      { id: 'pac', nome: 'PAC — Encomenda', prazo: (dist+4) + ' a ' + (dist+8) + ' dias úteis', valor: Math.round((12.50 + dist*0.9)*100)/100, icon: '📬' },
      { id: 'expresso', nome: 'SEDEX 10 — Expressa', prazo: dist <= 1 ? '1 dia útil' : '1 a ' + (dist+1) + ' dias úteis', valor: Math.round((28.90 + dist*2.8)*100)/100, icon: '⚡' }
    ]
  };
}

function resetFreteBtn() {
  var btn = document.getElementById('btn-calc-frete');
  if (btn) { btn.textContent = 'Calcular'; btn.disabled = false; }
}

function selecionarFrete(opcaoId) {
  var cached = FRETE_CACHE[state.frete.cep];
  if (!cached) return;
  var opc = cached.opcoes.find(function(o) { return o.id === opcaoId; });
  if (!opc) return;
  state.frete.opcao = opc.id;
  state.frete.valor = opc.valor;
  state.frete.prazo = opc.prazo;
  render();
}

function renderFreteCalc(contexto) {
  var h = '<div class="frete-calc">';
  h += '<div class="frete-calc-title">🚚 Calcular frete e prazo de entrega</div>';
  h += '<div class="frete-input-row">';
  h += '<input type="text" id="frete-cep-input" placeholder="Digite seu CEP" maxlength="9" value="' + (state.frete.cep || '') + '" onkeyup="this.value=this.value.replace(/\\D/g,\'\').replace(/(\\d{5})(\\d)/,\'$1-$2\')" onkeydown="if(event.key===\'Enter\'){document.getElementById(\'btn-calc-frete\').click()}">';
  h += '<button id="btn-calc-frete" onclick="var c=document.getElementById(\'frete-cep-input\').value;state.frete.cep=c.replace(/\\D/g,\'\');calcularFrete(c,function(r){state.frete.calculado=true;if(!state.frete.opcao&&r.opcoes.length)selecionarFrete(r.opcoes[0].id);else render();})">Calcular</button>';
  h += '</div>';

  if (state.frete.calculado && FRETE_CACHE[state.frete.cep]) {
    var dados = FRETE_CACHE[state.frete.cep];
    h += '<div class="frete-opcoes">';
    dados.opcoes.forEach(function(opc) {
      var sel = state.frete.opcao === opc.id ? ' selected' : '';
      h += '<div class="frete-opcao' + sel + '" onclick="selecionarFrete(\'' + opc.id + '\')">';
      h += '<div class="frete-radio"></div>';
      h += '<div style="font-size:18px">' + opc.icon + '</div>';
      h += '<div class="frete-info"><div class="frete-nome">' + opc.nome + '</div>';
      h += '<div class="frete-prazo">Receba em ' + opc.prazo + '</div></div>';
      h += '<div class="frete-preco' + (opc.valor === 0 ? ' gratis' : '') + '">' + (opc.valor === 0 ? 'Grátis' : 'R$ ' + formatMoney(opc.valor)) + '</div>';
      h += '</div>';
    });
    h += '</div>';
    if (dados.endereco) {
      h += '<div class="frete-endereco">📍 Entrega para: <strong>' + escHtml(dados.endereco) + '</strong></div>';
    }
  }
  h += '</div>';
  return h;
}
