<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZM — Atacadista e Material de Construção</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23E20031'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='system-ui' font-weight='900' font-size='28' fill='%23fff'%3EZM%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --blue: #E20031;
  --blue-dark: #B8002A;
  --blue-light: #FDEAEF;
  --blue-50: #FEF5EA;
  --orange: #e7193e;
  --orange-dark: #B8002A;
  --orange-light: #FEF5EA;
  --white: #FFFFFF;
  --gray-50: #FEF5EA;
  --gray-100: #F5EDE0;
  --gray-200: #E5E7EB;
  --gray-300: #D1D5DB;
  --gray-400: #9CA3AF;
  --gray-500: #6B7280;
  --gray-600: #4B5563;
  --gray-700: #374151;
  --gray-800: #1F2937;
  --gray-900: #111827;
  --green: #059669;
  --green-light: #ECFDF5;
  --red: #DC2626;
  --red-light: #FEF2F2;
  --yellow: #D97706;
  --yellow-light: #FFFBEB;
  --radius: 12px;
  --radius-sm: 8px;
  --radius-xs: 6px;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 6px rgba(0,0,0,0.05), 0 2px 4px rgba(0,0,0,0.03);
  --shadow-lg: 0 10px 25px rgba(0,0,0,0.08), 0 4px 10px rgba(0,0,0,0.04);
  --shadow-xl: 0 20px 40px rgba(0,0,0,0.1);
  --transition: all 0.2s cubic-bezier(0.4,0,0.2,1);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',system-ui,sans-serif;background:#FEF5EA;color:var(--gray-900);-webkit-font-smoothing:antialiased;line-height:1.5;}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;cursor:pointer;border:none;outline:none;}
input,select,textarea{font-family:inherit;outline:none;}
img{max-width:100%;display:block;}

/* SCROLLBAR */
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:var(--gray-400);}

/* TOP BAR */
.top-bar{background:#1a1a1a;color:var(--gray-400);font-size:12px;padding:6px 0;letter-spacing:0.02em;}
.top-bar .container{display:flex;justify-content:space-between;align-items:center;}
.top-bar a{color:var(--gray-300);transition:var(--transition);}
.top-bar a:hover{color:#fff;}

/* HEADER */
.header{background:#FEF5EA;padding:14px 0;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,0.06);border-bottom:1px solid rgba(226,0,49,0.08);}
.header .container{display:flex;align-items:center;gap:16px;}
.h-btn-home{width:42px;height:42px;border-radius:var(--radius-sm);background:rgba(226,0,49,0.06);color:#E20031;display:flex;align-items:center;justify-content:center;transition:var(--transition);flex-shrink:0;}
.h-btn-home:hover{background:rgba(226,0,49,0.14);color:#B8002A;transform:scale(1.05);}
.header-logo{display:flex;align-items:center;gap:10px;white-space:nowrap;position:relative;cursor:pointer;}
.header-logo .logo-container{height:56px;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative;}
.header-logo .logo-container img{height:100%;width:auto;object-fit:contain;transform-origin:center;transition:transform 0.2s;}
.header-logo .logo-edit-hint{position:absolute;inset:0;background:rgba(226,0,49,0.7);color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 0.2s;border-radius:6px;pointer-events:none;}
.header-logo:hover .logo-edit-hint{opacity:1;}
.logo-zoom-panel{position:absolute;top:calc(100% + 8px);left:0;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:16px;z-index:200;min-width:280px;border:1px solid var(--gray-200);}
.logo-zoom-panel .zoom-preview{width:250px;height:120px;overflow:hidden;border-radius:var(--radius-sm);background:#FEF5EA;display:flex;align-items:center;justify-content:center;margin-bottom:12px;border:1px solid var(--gray-200);}
.logo-zoom-panel .zoom-preview img{transform-origin:center;transition:transform 0.15s;}
.logo-zoom-panel label{font-size:12px;font-weight:600;color:var(--gray-600);display:block;margin-bottom:6px;}
.logo-zoom-panel input[type="range"]{width:100%;accent-color:#E20031;margin-bottom:12px;}
.logo-zoom-panel .zoom-actions{display:flex;gap:8px;}
.logo-zoom-panel .zoom-actions button{flex:1;padding:8px;border-radius:var(--radius-xs);font-size:12px;font-weight:600;}
.logo-zoom-panel .btn-upload{background:rgba(226,0,49,0.08);color:#E20031;border:1px solid rgba(226,0,49,0.15);}
.logo-zoom-panel .btn-upload:hover{background:rgba(226,0,49,0.15);}
.logo-zoom-panel .btn-save{background:#E20031;color:#fff;}
.logo-zoom-panel .btn-save:hover{background:#B8002A;}
.search-wrap{flex:1;max-width:640px;position:relative;}
.search-wrap input{width:100%;padding:12px 48px 12px 18px;border:2px solid var(--gray-200);border-radius:999px;font-size:14px;background:#fff;color:var(--gray-900);transition:var(--transition);}
.search-wrap input:focus{border-color:#E20031;box-shadow:0 0 0 3px rgba(226,0,49,0.08);}
.search-wrap input::placeholder{color:var(--gray-400);}
.search-wrap button{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:#E20031;color:#fff;border:none;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:var(--transition);}
.search-wrap button:hover{background:#B8002A;}
.header-actions{display:flex;align-items:center;gap:8px;margin-left:auto;}
.h-btn{display:flex;align-items:center;gap:8px;color:var(--gray-700);font-size:13px;font-weight:600;padding:8px 14px;border-radius:var(--radius-sm);background:rgba(226,0,49,0.06);transition:var(--transition);white-space:nowrap;}
.h-btn:hover{background:rgba(226,0,49,0.12);color:#E20031;}
.h-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0;}
.h-btn .badge{background:#E20031;color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:99px;margin-left:2px;}

/* NAV */
.nav-bar{background:#fff;border-bottom:1px solid var(--gray-200);padding:0;overflow-x:auto;}
.nav-bar .container{display:flex;gap:0;}
.nav-item{padding:12px 18px;font-size:13px;font-weight:500;color:var(--gray-600);white-space:nowrap;cursor:pointer;border-bottom:2px solid transparent;transition:var(--transition);}
.nav-item:hover{color:#E20031;background:rgba(226,0,49,0.04);}
.nav-item.active{color:#E20031;border-bottom-color:#E20031;font-weight:600;}

/* CONTAINER */
.container{max-width:1280px;margin:0 auto;padding:0 24px;}

/* HERO BANNER */
.hero{padding:24px 0;}
.hero-grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;}
.hero-main{position:relative;border-radius:var(--radius);overflow:hidden;background:linear-gradient(135deg,#E20031,#F75263);min-height:320px;display:flex;align-items:center;padding:48px;color:#fff;}
.hero-main h2{font-size:36px;font-weight:900;letter-spacing:-0.03em;line-height:1.15;margin-bottom:12px;}
.hero-main p{font-size:16px;opacity:0.8;margin-bottom:24px;max-width:400px;}
.hero-main .hero-cta{display:inline-flex;align-items:center;gap:8px;background:#99CC00;color:#fff;padding:14px 28px;border-radius:999px;font-weight:700;font-size:14px;transition:var(--transition);text-shadow:0 1px 2px rgba(0,0,0,0.15);}
.hero-main .hero-cta:hover{background:#8DA91B;transform:translateY(-1px);}
.hero-side{display:flex;flex-direction:column;gap:16px;}
.hero-card{flex:1;border-radius:var(--radius);padding:28px;display:flex;flex-direction:column;justify-content:center;}
.hero-card:nth-child(1){background:linear-gradient(135deg,#8DA91B,#99CC00);color:#fff;}
.hero-card:nth-child(2){background:linear-gradient(135deg,#E20031,#F75263);color:#fff;}
.hero-card h3{font-size:18px;font-weight:800;margin-bottom:4px;}
.hero-card p{font-size:13px;opacity:0.85;}

/* SECTION */
.section{padding:32px 0;}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.section-header h2{font-size:20px;font-weight:800;letter-spacing:-0.02em;color:var(--gray-900);}
.section-header a{font-size:13px;font-weight:600;color:var(--blue);display:flex;align-items:center;gap:4px;}

/* PRODUCT GRID */
.product-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;}
.product-card{background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:var(--transition);cursor:pointer;position:relative;}
.product-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-3px);}
.product-img{width:100%;aspect-ratio:1;background:var(--gray-100);display:flex;align-items:center;justify-content:center;font-size:48px;position:relative;overflow:hidden;}
.product-img .tag{position:absolute;top:8px;left:8px;background:var(--orange);color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px;letter-spacing:0.02em;}
.product-img .tag-green{background:var(--green);}
.product-body{padding:14px;}
.product-cat{font-size:10px;font-weight:600;color:var(--blue);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px;}
.product-name{font-size:13px;font-weight:600;color:var(--gray-800);margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4;min-height:36px;}
.product-price-old{font-size:11px;color:var(--gray-400);text-decoration:line-through;}
.product-price{font-size:18px;font-weight:800;color:var(--green);margin:2px 0;}
.product-installment{font-size:11px;color:var(--gray-500);}
.product-actions{display:flex;gap:6px;margin-top:10px;}
.product-actions .btn-cart{flex:1;background:var(--blue);color:#fff;border:none;padding:8px;border-radius:var(--radius-xs);font-size:12px;font-weight:600;transition:var(--transition);display:flex;align-items:center;justify-content:center;gap:4px;}
.product-actions .btn-cart:hover{background:var(--blue-dark);}
.product-actions .btn-fav{width:34px;height:34px;background:var(--gray-100);border:none;border-radius:var(--radius-xs);display:flex;align-items:center;justify-content:center;transition:var(--transition);color:var(--gray-400);}
.product-actions .btn-fav:hover{background:var(--red-light);color:var(--red);}

/* CATEGORIES BAR */
.cat-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:12px;margin-bottom:8px;}
.cat-card{background:#fff;border-radius:var(--radius);padding:20px 14px;text-align:center;box-shadow:var(--shadow);cursor:pointer;transition:var(--transition);border:1px solid transparent;}
.cat-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);border-color:rgba(226,0,49,0.15);}
.cat-card .cat-icon{margin-bottom:10px;color:#E20031;display:flex;align-items:center;justify-content:center;}
.cat-card .cat-label{font-size:12px;font-weight:700;color:var(--gray-700);letter-spacing:-0.01em;}

/* PAGINATION */
.pagination{display:flex;justify-content:center;gap:6px;padding:32px 0;}
.pagination button{width:38px;height:38px;border-radius:var(--radius-xs);border:1px solid var(--gray-200);background:#fff;font-size:13px;font-weight:600;color:var(--gray-600);transition:var(--transition);}
.pagination button:hover{border-color:var(--blue);color:var(--blue);}
.pagination button.active{background:var(--blue);color:#fff;border-color:var(--blue);}

/* FOOTER */
.footer{background:#1a0005;color:rgba(255,255,255,0.5);padding:48px 0 24px;margin-top:48px;}
.footer-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:48px;margin-bottom:32px;}
.footer h3{color:#fff;font-size:14px;font-weight:700;margin-bottom:16px;}
.footer p,.footer a{font-size:13px;line-height:1.8;color:var(--gray-400);}
.footer a:hover{color:#fff;}
.footer-bottom{border-top:1px solid rgba(255,255,255,0.08);padding-top:24px;display:flex;justify-content:space-between;align-items:center;font-size:12px;}
.footer-payments{display:flex;gap:8px;}
.footer-payments span{background:rgba(255,255,255,0.06);padding:4px 10px;border-radius:4px;font-size:11px;font-weight:600;color:var(--gray-300);}

/* MODAL OVERLAY */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:500;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity 0.2s;}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow-xl);max-height:90vh;overflow-y:auto;width:100%;}
.modal-sm{max-width:440px;}
.modal-md{max-width:600px;}
.modal-lg{max-width:900px;}
.modal-xl{max-width:1100px;}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--gray-200);}
.modal-header h3{font-size:18px;font-weight:700;}
.modal-close{width:32px;height:32px;border-radius:8px;background:var(--gray-100);display:flex;align-items:center;justify-content:center;transition:var(--transition);color:var(--gray-500);}
.modal-close:hover{background:var(--gray-200);color:var(--gray-700);}
.modal-body{padding:24px;}
.modal-footer{padding:16px 24px;border-top:1px solid var(--gray-200);display:flex;gap:8px;justify-content:flex-end;}

/* FORMS */
.form-group{margin-bottom:16px;}
.form-label{display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;}
.form-input{width:100%;padding:10px 14px;border:1px solid var(--gray-300);border-radius:var(--radius-xs);font-size:14px;transition:var(--transition);background:#fff;}
.form-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(7,42,216,0.1);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-tabs{display:flex;gap:0;margin-bottom:20px;border:1px solid var(--gray-200);border-radius:var(--radius-xs);overflow:hidden;}
.form-tab{flex:1;padding:10px;text-align:center;font-size:13px;font-weight:600;cursor:pointer;background:var(--gray-50);color:var(--gray-500);transition:var(--transition);}
.form-tab.active{background:var(--blue);color:#fff;}

/* BUTTONS */
.btn{padding:10px 20px;border-radius:var(--radius-xs);font-size:14px;font-weight:600;transition:var(--transition);display:inline-flex;align-items:center;gap:8px;justify-content:center;}
.btn-primary{background:var(--blue);color:#fff;}
.btn-primary:hover{background:var(--blue-dark);}
.btn-orange{background:var(--orange);color:#fff;}
.btn-orange:hover{background:var(--orange-dark);}
.btn-outline{background:#fff;color:var(--gray-700);border:1px solid var(--gray-300);}
.btn-outline:hover{border-color:var(--blue);color:var(--blue);}
.btn-green{background:var(--green);color:#fff;}
.btn-sm{padding:7px 14px;font-size:12px;}
.btn-lg{padding:14px 28px;font-size:15px;}
.btn-block{width:100%;}

/* CART DRAWER */
.cart-drawer{position:fixed;top:0;right:-420px;width:420px;height:100vh;background:#fff;z-index:600;box-shadow:-10px 0 40px rgba(0,0,0,0.15);transition:right 0.3s cubic-bezier(0.4,0,0.2,1);display:flex;flex-direction:column;}
.cart-drawer.open{right:0;}
.cart-drawer-header{padding:20px;border-bottom:1px solid var(--gray-200);display:flex;justify-content:space-between;align-items:center;}
.cart-drawer-header h3{font-size:18px;font-weight:800;}
.cart-drawer-body{flex:1;overflow-y:auto;padding:16px 20px;}
.cart-item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--gray-100);}
.cart-item-img{width:72px;height:72px;background:var(--gray-100);border-radius:var(--radius-xs);display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;}
.cart-item-info{flex:1;}
.cart-item-name{font-size:13px;font-weight:600;margin-bottom:4px;}
.cart-item-price{font-size:15px;font-weight:800;color:var(--green);}
.cart-item-qty{display:flex;align-items:center;gap:0;margin-top:6px;}
.cart-item-qty button{width:28px;height:28px;border:1px solid var(--gray-200);background:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--gray-600);}
.cart-item-qty button:first-child{border-radius:6px 0 0 6px;}
.cart-item-qty button:last-child{border-radius:0 6px 6px 0;}
.cart-item-qty span{width:36px;text-align:center;font-size:13px;font-weight:600;border-top:1px solid var(--gray-200);border-bottom:1px solid var(--gray-200);height:28px;line-height:28px;}
.cart-item-remove{color:var(--gray-400);font-size:11px;cursor:pointer;margin-top:4px;display:inline-block;}
.cart-item-remove:hover{color:var(--red);}
.cart-drawer-footer{padding:20px;border-top:1px solid var(--gray-200);background:var(--gray-50);}
.cart-total{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.cart-total .label{font-size:14px;color:var(--gray-500);}
.cart-total .value{font-size:22px;font-weight:900;color:var(--gray-900);}
.cart-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:550;opacity:0;pointer-events:none;transition:opacity 0.3s;}
.cart-overlay.open{opacity:1;pointer-events:all;}

/* CHECKOUT PAGE */
.checkout-wrap{display:grid;grid-template-columns:1.4fr 1fr;gap:32px;padding:32px 0;}
.checkout-section{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;margin-bottom:20px;}
.checkout-section h3{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.checkout-section h3 .step{width:28px;height:28px;background:var(--blue);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
.pay-method{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px;}
.pay-method-card{padding:16px;border:2px solid var(--gray-200);border-radius:var(--radius-sm);text-align:center;cursor:pointer;transition:var(--transition);}
.pay-method-card:hover{border-color:var(--blue);}
.pay-method-card.selected{border-color:var(--blue);background:var(--blue-50);}
.pay-method-card .pay-icon{font-size:28px;margin-bottom:6px;}
.pay-method-card .pay-label{font-size:12px;font-weight:600;color:var(--gray-700);}
.pix-area{text-align:center;padding:20px;}
.pix-qr{width:200px;height:200px;background:var(--gray-100);border-radius:var(--radius);margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--gray-500);border:2px dashed var(--gray-300);}
.boleto-area{text-align:center;padding:20px;}
.boleto-code{background:var(--gray-100);padding:12px;border-radius:var(--radius-xs);font-family:monospace;font-size:12px;word-break:break-all;margin-bottom:12px;}
.order-summary{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;position:sticky;top:100px;}
.order-summary h3{font-size:16px;font-weight:700;margin-bottom:16px;}
.order-line{display:flex;justify-content:space-between;padding:8px 0;font-size:13px;color:var(--gray-600);}
.order-line.total{border-top:2px solid var(--gray-200);margin-top:8px;padding-top:12px;font-size:18px;font-weight:800;color:var(--gray-900);}

/* AREA CLIENTE */
.client-layout{display:grid;grid-template-columns:240px 1fr;gap:24px;padding:32px 0;}
.client-sidebar{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;height:fit-content;position:sticky;top:100px;}
.client-avatar{width:64px;height:64px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;margin:0 auto 12px;}
.client-name{text-align:center;font-size:14px;font-weight:700;margin-bottom:4px;}
.client-doc{text-align:center;font-size:11px;color:var(--gray-400);margin-bottom:20px;}
.client-menu{list-style:none;}
.client-menu li{padding:10px 14px;font-size:13px;font-weight:500;color:var(--gray-600);border-radius:var(--radius-xs);cursor:pointer;transition:var(--transition);margin-bottom:2px;}
.client-menu li:hover{background:var(--gray-50);color:var(--gray-900);}
.client-menu li.active{background:var(--blue-50);color:var(--blue);font-weight:600;}
.client-content{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;}
.order-card{border:1px solid var(--gray-200);border-radius:var(--radius-sm);padding:16px;margin-bottom:12px;transition:var(--transition);}
.order-card:hover{border-color:var(--blue-light);box-shadow:var(--shadow-md);}
.order-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.order-id{font-size:14px;font-weight:700;}
.order-status{padding:4px 10px;border-radius:99px;font-size:11px;font-weight:700;}
.status-green{background:var(--green-light);color:var(--green);}
.status-yellow{background:var(--yellow-light);color:var(--yellow);}
.status-blue{background:var(--blue-light);color:var(--blue);}
.order-items-preview{font-size:12px;color:var(--gray-500);margin-bottom:8px;}
.order-bottom{display:flex;justify-content:space-between;font-size:13px;}
.order-bottom .date{color:var(--gray-400);}
.order-bottom .total{font-weight:700;color:var(--gray-900);}

/* ADMIN */
.admin-wrap{display:grid;grid-template-columns:240px 1fr;min-height:100vh;}
.admin-sidebar{background:var(--gray-900);color:#fff;padding:20px 14px;}
.admin-logo{font-size:18px;font-weight:900;color:#fff;padding:10px 14px;margin-bottom:24px;display:flex;align-items:center;gap:10px;}
.admin-logo small{font-size:10px;color:var(--gray-400);font-weight:500;}
.admin-nav{list-style:none;}
.admin-nav li{padding:10px 14px;font-size:13px;font-weight:500;color:rgba(255,255,255,0.5);border-radius:var(--radius-xs);cursor:pointer;transition:var(--transition);margin-bottom:2px;display:flex;align-items:center;gap:10px;}
.admin-nav li:hover{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.85);}
.admin-nav li.active{background:var(--blue);color:#fff;font-weight:600;}
.admin-nav li svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;}
.admin-content{padding:24px 32px;background:var(--gray-50);}
.admin-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
.admin-header h2{font-size:24px;font-weight:800;letter-spacing:-0.02em;}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
.stat-card{background:#fff;border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);}
.stat-card .stat-label{font-size:12px;font-weight:600;color:var(--gray-400);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;}
.stat-card .stat-value{font-size:28px;font-weight:900;letter-spacing:-0.02em;}
.stat-card .stat-change{font-size:12px;font-weight:600;margin-top:4px;}
.stat-card .stat-change.up{color:var(--green);}
.stat-card .stat-change.down{color:var(--red);}
.data-table{width:100%;border-collapse:collapse;}
.data-table th{text-align:left;font-size:11px;font-weight:600;color:var(--gray-400);text-transform:uppercase;letter-spacing:0.06em;padding:12px 16px;border-bottom:2px solid var(--gray-200);}
.data-table td{padding:12px 16px;font-size:13px;border-bottom:1px solid var(--gray-100);}
.data-table tr:hover td{background:var(--gray-50);}
.stock-low{color:var(--red);font-weight:700;}
.stock-ok{color:var(--green);font-weight:600;}

/* NF MODAL */
.nf-preview{background:#fff;border:1px solid var(--gray-200);padding:32px;font-family:'Courier New',monospace;font-size:12px;max-width:600px;margin:0 auto;}
.nf-header-block{border:2px solid #000;padding:12px;margin-bottom:16px;text-align:center;}
.nf-header-block h2{font-size:16px;font-weight:700;font-family:'Inter',sans-serif;}
.nf-table{width:100%;border-collapse:collapse;margin-bottom:16px;}
.nf-table th,.nf-table td{border:1px solid #999;padding:6px 8px;text-align:left;font-size:11px;}
.nf-table th{background:#eee;font-weight:700;}

/* FRETE CALCULATOR */
.frete-calc{margin-top:20px;padding:20px;background:var(--gray-50);border-radius:var(--radius-sm);border:1px solid var(--gray-200);}
.frete-calc-title{font-size:13px;font-weight:700;color:var(--gray-700);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.frete-input-row{display:flex;gap:8px;margin-bottom:12px;}
.frete-input-row input{flex:1;padding:10px 14px;border:1px solid var(--gray-200);border-radius:var(--radius-xs);font-size:13px;background:#fff;}
.frete-input-row input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(7,42,216,0.08);}
.frete-input-row button{padding:10px 20px;background:var(--blue);color:#fff;border-radius:var(--radius-xs);font-size:13px;font-weight:600;transition:var(--transition);white-space:nowrap;}
.frete-input-row button:hover{background:var(--blue-dark);}
.frete-opcoes{display:flex;flex-direction:column;gap:8px;}
.frete-opcao{display:flex;align-items:center;gap:12px;padding:12px 14px;border:2px solid var(--gray-200);border-radius:var(--radius-sm);cursor:pointer;transition:var(--transition);background:#fff;}
.frete-opcao:hover{border-color:var(--blue-light);background:var(--blue-50);}
.frete-opcao.selected{border-color:var(--blue);background:var(--blue-50);}
.frete-opcao .frete-radio{width:18px;height:18px;border:2px solid var(--gray-300);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.frete-opcao.selected .frete-radio{border-color:var(--blue);}
.frete-opcao.selected .frete-radio::after{content:'';width:10px;height:10px;background:var(--blue);border-radius:50%;}
.frete-opcao .frete-info{flex:1;}
.frete-opcao .frete-nome{font-size:13px;font-weight:600;color:var(--gray-800);}
.frete-opcao .frete-prazo{font-size:11px;color:var(--gray-400);margin-top:2px;}
.frete-opcao .frete-preco{font-size:14px;font-weight:800;color:var(--gray-900);white-space:nowrap;}
.frete-opcao .frete-preco.gratis{color:var(--green);}
.frete-endereco{font-size:12px;color:var(--gray-500);margin-top:10px;padding:8px 12px;background:#fff;border-radius:var(--radius-xs);border:1px solid var(--gray-100);}

/* CATALOG WITH FILTERS */
.catalog-layout{display:grid;grid-template-columns:260px 1fr;gap:24px;align-items:flex-start;}
.filters-sidebar{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;position:sticky;top:120px;}
.filters-title{font-size:14px;font-weight:800;letter-spacing:-0.01em;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;}
.filters-title a{font-size:11px;font-weight:600;color:var(--blue);cursor:pointer;}
.filter-group{padding:14px 0;border-top:1px solid var(--gray-100);}
.filter-group:first-of-type{border-top:0;padding-top:0;}
.filter-group h4{font-size:12px;font-weight:700;color:var(--gray-700);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:10px;}
.filter-group select,.filter-group input{width:100%;padding:8px 10px;border:1px solid var(--gray-200);border-radius:var(--radius-xs);font-size:12px;background:#fff;}
.filter-group select:focus,.filter-group input:focus{border-color:var(--blue);}
.price-range{display:flex;gap:6px;align-items:center;}
.price-range input{flex:1;font-size:12px;}
.price-range span{font-size:11px;color:var(--gray-400);}
.filter-check{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;color:var(--gray-700);cursor:pointer;}
.filter-check input{width:auto;margin:0;accent-color:var(--blue);}
.filter-clear{width:100%;margin-top:10px;padding:8px;background:var(--gray-100);color:var(--gray-700);border-radius:var(--radius-xs);font-size:12px;font-weight:600;}
.filter-clear:hover{background:var(--gray-200);}
.catalog-layout .product-grid{grid-template-columns:repeat(4,1fr);}
.no-results{text-align:center;padding:60px 20px;color:var(--gray-400);background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);}
.no-results .icon{font-size:48px;margin-bottom:12px;}

/* PODIUM (VENDEDORES) */
.podium-wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:end;margin-bottom:32px;}
.podium-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:24px 20px;text-align:center;position:relative;overflow:hidden;}
.podium-card.gold{background:linear-gradient(180deg,#FFFBEB 0%,#fff 100%);border:2px solid #F59E0B;transform:scale(1.05);box-shadow:0 8px 24px rgba(245,158,11,0.25);}
.podium-card.silver{background:linear-gradient(180deg,#F3F4F6 0%,#fff 100%);border:2px solid #9CA3AF;}
.podium-card.bronze{background:linear-gradient(180deg,#FFEDD5 0%,#fff 100%);border:2px solid #EA580C;}
.podium-medal{position:absolute;top:-2px;right:14px;font-size:32px;}
.podium-avatar{width:72px;height:72px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;margin:0 auto 12px;border:3px solid #fff;box-shadow:var(--shadow-md);}
.podium-name{font-size:15px;font-weight:800;margin-bottom:2px;}
.podium-role{font-size:11px;color:var(--gray-400);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:14px;}
.podium-value{font-size:22px;font-weight:900;color:var(--green);letter-spacing:-0.02em;}
.podium-meta{font-size:11px;color:var(--gray-500);margin-top:4px;}
.podium-progress{height:6px;background:var(--gray-100);border-radius:99px;margin-top:10px;overflow:hidden;}
.podium-progress-bar{height:100%;background:linear-gradient(90deg,var(--green),#34D399);border-radius:99px;transition:width 0.6s;}
.seller-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 18px;display:grid;grid-template-columns:auto 1fr auto auto auto;gap:18px;align-items:center;margin-bottom:8px;transition:var(--transition);}
.seller-card:hover{box-shadow:var(--shadow-md);transform:translateX(2px);}
.seller-rank{font-size:18px;font-weight:900;color:var(--gray-300);width:28px;text-align:center;}
.seller-info{display:flex;align-items:center;gap:10px;}
.seller-avatar{width:38px;height:38px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;flex-shrink:0;}
.seller-name{font-size:13px;font-weight:700;}
.seller-meta{font-size:11px;color:var(--gray-400);}
.seller-bar{width:140px;}
.seller-bar-track{height:6px;background:var(--gray-100);border-radius:99px;overflow:hidden;}
.seller-bar-fill{height:100%;background:var(--blue);border-radius:99px;}
.seller-pct{font-size:11px;font-weight:700;color:var(--gray-600);text-align:right;margin-top:2px;}
.seller-vendas{font-size:14px;font-weight:800;color:var(--gray-900);text-align:right;}
.seller-comm{font-size:11px;color:var(--green);font-weight:600;text-align:right;}

/* CHART */
.chart-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;}
.chart-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.chart-header h3{font-size:15px;font-weight:700;}
.chart-tabs{display:flex;gap:4px;background:var(--gray-100);padding:3px;border-radius:var(--radius-xs);}
.chart-tab{padding:6px 14px;font-size:11px;font-weight:600;border-radius:6px;color:var(--gray-500);cursor:pointer;}
.chart-tab.active{background:#fff;color:var(--gray-900);box-shadow:var(--shadow);}
.bar-chart{display:flex;align-items:flex-end;gap:14px;height:180px;padding-top:16px;border-bottom:1px solid var(--gray-100);}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;}
.bar-vis{width:100%;background:linear-gradient(180deg,#E20031,#F75263);border-radius:6px 6px 0 0;position:relative;transition:all 0.4s;min-height:8px;}
.bar-vis:hover{background:linear-gradient(180deg,#B8002A,#E20031);}
.bar-vis .bar-tooltip{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:var(--gray-900);color:#fff;font-size:11px;padding:4px 8px;border-radius:4px;white-space:nowrap;margin-bottom:4px;opacity:0;pointer-events:none;transition:opacity 0.2s;}
.bar-vis:hover .bar-tooltip{opacity:1;}
.bar-label{font-size:11px;color:var(--gray-500);font-weight:600;}
.bar-value{font-size:11px;font-weight:700;color:var(--gray-900);}

/* CASHBACK */
.cashback-banner{background:linear-gradient(135deg,#059669 0%,#10B981 100%);color:#fff;border-radius:var(--radius);padding:20px 24px;display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;box-shadow:0 8px 20px rgba(5,150,105,0.25);}
.cashback-banner .cb-info .label{font-size:11px;text-transform:uppercase;letter-spacing:0.1em;font-weight:700;opacity:0.85;}
.cashback-banner .cb-info .value{font-size:32px;font-weight:900;letter-spacing:-0.02em;margin:4px 0;}
.cashback-banner .cb-info .sub{font-size:12px;opacity:0.9;}
.cashback-banner .cb-icon{font-size:48px;}
.cb-toggle{display:flex;align-items:center;gap:12px;padding:14px 16px;background:linear-gradient(135deg,rgba(5,150,105,0.08),rgba(16,185,129,0.04));border:1px solid rgba(5,150,105,0.2);border-radius:var(--radius-sm);margin:14px 0;}
.cb-toggle input{accent-color:var(--green);width:18px;height:18px;}
.cb-toggle .cb-text{flex:1;font-size:13px;color:var(--gray-700);}
.cb-toggle .cb-text strong{color:var(--green);font-weight:700;}
.cb-history-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--gray-100);font-size:13px;}
.cb-history-row .cb-tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:0.06em;}
.cb-tag.in{background:var(--green-light);color:var(--green);}
.cb-tag.out{background:#FEF2F2;color:var(--red);}

/* CUPONS */
.coupon-row{display:flex;gap:8px;margin:14px 0;}
.coupon-row input{flex:1;padding:12px 14px;border:2px solid var(--gray-200);border-radius:var(--radius-xs);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;background:#fff;}
.coupon-row input:focus{border-color:var(--blue);}
.coupon-row button{padding:12px 22px;background:var(--gray-900);color:#fff;border-radius:var(--radius-xs);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;}
.coupon-row button:hover{background:var(--blue);}
.coupon-applied{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:linear-gradient(135deg,rgba(5,150,105,0.08),rgba(16,185,129,0.04));border:1px dashed var(--green);border-radius:var(--radius-sm);font-size:13px;}
.coupon-applied .left{display:flex;align-items:center;gap:10px;}
.coupon-applied .code{background:var(--green);color:#fff;font-weight:800;padding:4px 10px;border-radius:4px;font-size:12px;letter-spacing:0.05em;}
.coupon-applied .desc{font-weight:600;color:var(--gray-700);}
.coupon-applied .remove{font-size:11px;color:var(--red);cursor:pointer;font-weight:600;}
.coupon-error{padding:10px 14px;background:#FEF2F2;color:var(--red);border-radius:var(--radius-xs);font-size:12px;font-weight:600;margin-top:8px;}
.coupon-card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 22px;border-left:4px solid var(--blue);margin-bottom:10px;display:grid;grid-template-columns:1fr auto auto auto auto;gap:16px;align-items:center;transition:var(--transition);}
.coupon-card:hover{box-shadow:var(--shadow-md);transform:translateX(2px);}
.coupon-card.inactive{opacity:0.5;border-left-color:var(--gray-400);}
.coupon-card.inactive .badge-status{background:var(--gray-200);color:var(--gray-600);}
.coupon-code-pill{font-family:'Courier New',monospace;font-size:14px;font-weight:800;background:var(--gray-900);color:#FFD60A;padding:8px 14px;border-radius:6px;letter-spacing:0.08em;}
.coupon-info .desc{font-size:13px;font-weight:700;color:var(--gray-900);}
.coupon-info .meta{font-size:11px;color:var(--gray-400);margin-top:2px;}
.coupon-discount{font-size:18px;font-weight:900;color:var(--green);text-align:right;}
.coupon-discount .sub{font-size:10px;color:var(--gray-400);font-weight:500;text-transform:uppercase;}
.coupon-uses{font-size:12px;font-weight:700;color:var(--gray-700);text-align:center;}
.coupon-uses .sub{font-size:10px;color:var(--gray-400);font-weight:500;text-transform:uppercase;}
.badge-status{padding:4px 10px;border-radius:99px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;}
.badge-status.active{background:var(--green-light);color:var(--green);}

/* INDICAÇÃO */
.referral-banner{background:linear-gradient(135deg,#7C3AED 0%,#A855F7 50%,#EC4899 100%);color:#fff;border-radius:var(--radius);padding:28px 32px;margin-bottom:24px;position:relative;overflow:hidden;box-shadow:0 12px 28px rgba(124,58,237,0.3);}
.referral-banner::before{content:'';position:absolute;top:-50%;right:-10%;width:300px;height:300px;background:radial-gradient(circle,rgba(255,255,255,0.15) 0%,transparent 70%);}
.referral-banner h3{font-size:24px;font-weight:900;letter-spacing:-0.02em;margin-bottom:8px;position:relative;}
.referral-banner p{font-size:14px;opacity:0.9;max-width:480px;line-height:1.5;position:relative;}
.referral-code-box{background:rgba(255,255,255,0.15);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.3);border-radius:var(--radius);padding:18px 22px;margin-top:18px;display:flex;align-items:center;gap:14px;position:relative;}
.referral-code-box .label{font-size:11px;text-transform:uppercase;letter-spacing:0.1em;opacity:0.85;font-weight:700;margin-bottom:4px;}
.referral-code-box .code{font-family:'Courier New',monospace;font-size:22px;font-weight:900;letter-spacing:0.1em;}
.referral-code-box button{background:#fff;color:#7C3AED;border-radius:var(--radius-xs);padding:10px 18px;font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;transition:var(--transition);}
.referral-code-box button:hover{transform:scale(1.05);}
.referral-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;}
.referral-stat{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;}
.referral-stat .label{font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--gray-400);font-weight:700;}
.referral-stat .value{font-size:26px;font-weight:900;letter-spacing:-0.02em;margin-top:4px;}
.referral-stat .sub{font-size:11px;color:var(--gray-500);margin-top:2px;}
.share-buttons{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
.share-btn{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:var(--radius-xs);font-size:12px;font-weight:700;letter-spacing:0.04em;cursor:pointer;transition:var(--transition);}
.share-btn.wpp{background:#25D366;color:#fff;}
.share-btn.wpp:hover{background:#128C7E;}
.share-btn.copy{background:var(--gray-100);color:var(--gray-700);}
.share-btn.copy:hover{background:var(--gray-200);}
.indicado-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--gray-100);}
.indicado-avatar{width:36px;height:36px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;}
.indicado-info .name{font-size:13px;font-weight:700;}
.indicado-info .date{font-size:11px;color:var(--gray-400);margin-top:2px;}
.indicado-status{padding:4px 10px;border-radius:99px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;}
.indicado-bonus{font-size:14px;font-weight:800;color:var(--green);}

/* PIX BANCO */
.bank-card{background:linear-gradient(135deg,#0F172A 0%,#1E293B 50%,#334155 100%);color:#fff;border-radius:var(--radius);padding:28px 32px;position:relative;overflow:hidden;box-shadow:0 12px 32px rgba(15,23,42,0.35);}
.bank-card::before{content:'';position:absolute;top:-30%;right:-10%;width:280px;height:280px;background:radial-gradient(circle,rgba(34,211,238,0.18) 0%,transparent 70%);}
.bank-card .bank-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;position:relative;}
.bank-card .bank-name{font-size:11px;text-transform:uppercase;letter-spacing:0.12em;color:#94A3B8;font-weight:700;}
.bank-card .bank-title{font-size:22px;font-weight:900;letter-spacing:-0.02em;margin-top:4px;}
.bank-card .bank-status{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:rgba(34,197,94,0.15);border:1px solid rgba(34,197,94,0.3);border-radius:99px;font-size:11px;font-weight:700;color:#22C55E;text-transform:uppercase;letter-spacing:0.06em;}
.bank-card .bank-status::before{content:'';width:7px;height:7px;background:#22C55E;border-radius:50%;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.bank-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;position:relative;}
.bank-item .label{font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:#94A3B8;font-weight:700;margin-bottom:4px;}
.bank-item .value{font-size:14px;font-weight:700;font-family:'Courier New',monospace;}
.zero-fee{display:inline-block;padding:4px 10px;background:rgba(34,197,94,0.2);color:#22C55E;font-size:11px;font-weight:800;border-radius:4px;letter-spacing:0.04em;}

/* PIX TRANSACTIONS */
.pix-tx-row{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:14px;align-items:center;padding:14px 18px;background:#fff;border-bottom:1px solid var(--gray-100);transition:var(--transition);}
.pix-tx-row:hover{background:var(--gray-50);}
.pix-status-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.pix-status-dot.pago{background:var(--green);box-shadow:0 0 0 4px rgba(5,150,105,0.15);}
.pix-status-dot.aguardando{background:var(--yellow);}
.pix-status-dot.expirado{background:var(--gray-400);}
.pix-tx-info .tx-id{font-family:'Courier New',monospace;font-size:11px;color:var(--gray-400);letter-spacing:0.04em;}
.pix-tx-info .tx-meta{font-size:13px;font-weight:700;}
.pix-tx-valor{font-size:15px;font-weight:800;color:var(--green);}
.pix-tx-tempo{font-size:11px;color:var(--gray-400);text-align:right;}
.pix-tx-acao{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;}
.tx-acao-pago{color:var(--green);}
.tx-acao-aguardando{color:var(--yellow);}
.tx-acao-expirado{color:var(--gray-400);}

.pix-flow{display:grid;grid-template-columns:repeat(4,1fr);gap:0;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;margin-bottom:20px;}
.pix-step{text-align:center;position:relative;padding:0 12px;}
.pix-step:not(:last-child)::after{content:'→';position:absolute;right:-8px;top:18px;color:var(--gray-300);font-size:20px;font-weight:700;}
.pix-step .step-icon{width:44px;height:44px;border-radius:50%;background:var(--blue-50);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:20px;margin:0 auto 8px;border:2px solid var(--blue);}
.pix-step.done .step-icon{background:var(--green-light);color:var(--green);border-color:var(--green);}
.pix-step .step-title{font-size:12px;font-weight:700;color:var(--gray-900);margin-bottom:2px;}
.pix-step .step-time{font-size:10px;color:var(--gray-400);}

/* TRIBUTAÇÃO */
.api-status-card{background:linear-gradient(135deg,#0EA5E9 0%,#0284C7 100%);color:#fff;border-radius:var(--radius);padding:24px 28px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;margin-bottom:24px;box-shadow:0 8px 24px rgba(14,165,233,0.3);position:relative;overflow:hidden;}
.api-status-card::before{content:'';position:absolute;top:-50%;right:0;width:300px;height:300px;background:radial-gradient(circle,rgba(255,255,255,0.1) 0%,transparent 70%);}
.api-status-card .api-info{position:relative;}
.api-status-card .label{font-size:11px;text-transform:uppercase;letter-spacing:0.12em;opacity:0.85;font-weight:700;}
.api-status-card .name{font-size:24px;font-weight:900;letter-spacing:-0.02em;margin:4px 0 8px;}
.api-status-card .meta{font-size:13px;opacity:0.9;}
.api-sync-btn{background:rgba(255,255,255,0.15);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.3);color:#fff;padding:14px 24px;border-radius:var(--radius-sm);font-size:13px;font-weight:700;cursor:pointer;letter-spacing:0.04em;text-transform:uppercase;display:flex;align-items:center;gap:8px;transition:var(--transition);}
.api-sync-btn:hover{background:rgba(255,255,255,0.25);transform:translateY(-2px);}
.api-sync-btn.loading{opacity:0.6;pointer-events:none;}
.api-sync-btn.loading::after{content:'';width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

.tax-breakdown{background:var(--gray-50);border-radius:var(--radius-sm);padding:14px 18px;margin:14px 0;}
.tax-breakdown h4{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:0.06em;color:var(--gray-700);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.tax-line{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;color:var(--gray-600);}
.tax-line.st{color:var(--orange);font-weight:700;}
.tax-total{display:flex;justify-content:space-between;font-size:13px;font-weight:800;padding-top:8px;margin-top:6px;border-top:1px solid var(--gray-200);color:var(--gray-900);}
.fiscal-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:10px;font-weight:700;letter-spacing:0.04em;text-transform:uppercase;}
.fiscal-pill.ncm{background:#EFF6FF;color:#1E40AF;font-family:'Courier New',monospace;}
.fiscal-pill.cst{background:#FEF3C7;color:#92400E;}
.fiscal-pill.st{background:#FFE4E6;color:#9F1239;}

.alert-card{display:flex;align-items:flex-start;gap:14px;padding:16px 20px;background:#FFFBEB;border-left:4px solid #F59E0B;border-radius:var(--radius-sm);margin-bottom:10px;}
.alert-card.critical{background:#FEF2F2;border-color:#DC2626;}
.alert-card .alert-icon{font-size:20px;flex-shrink:0;}
.alert-card .alert-content{flex:1;}
.alert-card .alert-title{font-size:13px;font-weight:800;margin-bottom:2px;}
.alert-card .alert-meta{font-size:11px;color:var(--gray-500);}

/* VIEWS */
.view{display:none;}
.view.active{display:block;}

/* RESPONSIVE */
@media(max-width:768px){
  .product-grid{grid-template-columns:repeat(2,1fr);}
  .cat-grid{grid-template-columns:repeat(4,1fr);}
  .hero-grid{grid-template-columns:1fr;}
  .hero-side{flex-direction:row;}
  .checkout-wrap{grid-template-columns:1fr;}
  .client-layout{grid-template-columns:1fr;}
  .admin-wrap{grid-template-columns:1fr;}
  .stat-grid{grid-template-columns:repeat(2,1fr);}
  .footer-grid{grid-template-columns:1fr 1fr;}
  .catalog-layout{grid-template-columns:1fr;}
  .filters-sidebar{position:relative;top:auto;}
  .catalog-layout .product-grid{grid-template-columns:repeat(2,1fr);}
  .podium-wrap{grid-template-columns:1fr;}
  .podium-card.gold{transform:none;}
  .seller-card{grid-template-columns:auto 1fr;gap:10px;}
  .seller-bar,.seller-vendas{grid-column:1/-1;}
}

function generateProducts() {
  var products = [];
  var id = 1;
  CATEGORIES.forEach(function(cat) {
    var names = PRODUCT_NAMES[cat.id];
    var emojis = EMOJIS[cat.id];
    var ncmList = NCM_DATABASE[cat.id] || NCM_DATABASE.construcao;
    names.forEach(function(name, i) {
      var basePrice = Math.round((Math.random() * 800 + 15) * 100) / 100;
      var hasDiscount = Math.random() > 0.6;
      var discount = hasDiscount ? Math.round(Math.random() * 30 + 5) : 0;
      var price = hasDiscount ? Math.round(basePrice * (1 - discount/100) * 100) / 100 : basePrice;
      var stock = Math.floor(Math.random() * 500) + 1;
      var fiscal = ncmList[i % ncmList.length];
      products.push({
        id: id++,
        name: name,
        cat: cat.id,
        catLabel: cat.label,
        sub: cat.subs[i % cat.subs.length],
        emoji: emojis[i % emojis.length],
        price: price,
        oldPrice: hasDiscount ? basePrice : 0,
        discount: discount,
        stock: stock,
        sold: Math.floor(Math.random() * 200),
        rating: (Math.random() * 2 + 3).toFixed(1),
        atacado: Math.random() > 0.5,
        installment: price > 100 ? Math.ceil(price / 12) : 0,
        ncm: fiscal.ncm,
        ncmDesc: fiscal.desc,
        cst: fiscal.cst,
        cfop: '5102',
        origem: 0,
        icms: fiscal.icms,
        ipi: fiscal.ipi,
        pis: fiscal.pis,
        cofins: fiscal.cofins,
        icmsST: fiscal.st
      });
    });
  });
  // Pad to ~2000
  while (products.length < 2000) {
    var src = products[Math.floor(Math.random() * 240)];
    var clone = JSON.parse(JSON.stringify(src));
    clone.id = id++;
    clone.name = src.name + ' ' + ['Premium','Plus','Pro','Max','Lite','Slim','Ultra','Mega','Master','Extra'][Math.floor(Math.random()*10)];
    clone.price = Math.round((src.price * (0.8 + Math.random() * 0.4)) * 100) / 100;
    clone.stock = Math.floor(Math.random() * 300) + 1;
    products.push(clone);
  }
  return products;
}

function applyFilters(arr) {
  var f = state.filters;
  var out = arr.filter(function(p) {
    if (state.catFilter && p.cat !== state.catFilter) return false;
    if (state.search) {
      var s = state.search.toLowerCase();
      if (p.name.toLowerCase().indexOf(s) < 0 && p.catLabel.toLowerCase().indexOf(s) < 0 && p.sub.toLowerCase().indexOf(s) < 0) return false;
    }
    if (f.priceMin !== '' && p.price < parseFloat(f.priceMin)) return false;
    if (f.priceMax !== '' && p.price > parseFloat(f.priceMax)) return false;
    if (f.soDesconto && !p.discount) return false;
    if (f.soAtacado && !p.atacado) return false;
    if (f.soEstoque && p.stock <= 0) return false;
    return true;
  });
  if (f.sort === 'priceAsc') out.sort(function(a,b){return a.price - b.price;});
  else if (f.sort === 'priceDesc') out.sort(function(a,b){return b.price - a.price;});
  else if (f.sort === 'sold') out.sort(function(a,b){return b.sold - a.sold;});
  else if (f.sort === 'discount') out.sort(function(a,b){return b.discount - a.discount;});
  else if (f.sort === 'rating') out.sort(function(a,b){return parseFloat(b.rating) - parseFloat(a.rating);});
  return out;
}

ht="10"/><rect fill="%23000" x="80" y="80" width="10" height="10"/></svg>') + '\') no-repeat center/contain"></div></div>';

    h += '<p style="font-size:12px;color:var(--gray-400);margin-bottom:8px">ou copie o código Pix abaixo</p>';
    h += '<p style="font-size:11px;color:var(--green);font-weight:700;margin-bottom:12px">✓ Pagamento direto na conta PJ · NF-e emitida automática em ~3s após confirmação</p>';

    h += '<button class="btn btn-primary btn-sm" onclick="alert(\'Código Pix copiado!\')">Copiar Código</button></div>';
  } else if (state.checkoutPay === 'cartao') {
    h += '<div class="form-group"><label class="form-label">Número do Cartão</label><input class="form-input" placeholder="0000 0000 0000 0000" maxlength="19"></div>';
    h += '<div class="form-row"><div class="form-group"><label class="form-label">Validade</label><input class="form-input" placeholder="MM/AA" maxlength="5"></div>';
    h += '<div class="form-group"><label class="form-label">CVV</label><input class="form-input" placeholder="000" maxlength="3"></div></div>';

    h += '<div class="form-group"><label class="form-label">Parcelas</label><select class="form-input">';
    for (var i = 1; i <= 12; i++) h += '<option>' + i + 'x de R$ ' + formatMoney(total/i) + (i===1?' (à vista)':i<=6?' sem juros':' com juros') + '</option>';
    h += '</select></div>';
  } else {
    h += '<div class="boleto-area"><div style="font-size:48px;margin-bottom:12px">📄</div>';
    h += '<p style="font-size:14px;font-weight:700;margin-bottom:8px">Boleto Bancário</p>';
    h += '<p style="font-size:12px;color:var(--gray-400);margin-bottom:16px">O boleto será gerado após confirmar o pedido. Vencimento em 3 dias úteis.</p>';
    h += '<div class="boleto-code">23793.38128 60000.000003 00000.000400 1 ' + (Math.floor(Math.random()*9000)+1000) + '0000' + Math.round(total*100) + '</div>';
    h += '<button class="btn btn-outline btn-sm" onclick="alert(\'Código copiado!\')">Copiar Linha Digitável</button></div>';

    h += '<div style="width:40px;height:40px;background:var(--gray-100);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:18px">' + p.emoji + '</div>';

    h += '<div style="font-size:11px;color:var(--gray-400)">Qtd: ' + item.qty + '</div></div>';
    h += '<div style="font-size:13px;font-weight:700">R$ ' + formatMoney(p.price * item.qty) + '</div></div>';
  });
  h += '<div class="order-line"><span>Subtotal</span><span>R$ ' + formatMoney(subtotal) + '</span></div>';

  if (state.frete.calculado && state.frete.opcao) {
    var opNome = {sedex:'SEDEX',pac:'PAC',expresso:'SEDEX 10'};
    freteLabel = 'Frete (' + (opNome[state.frete.opcao]||'') + ')';
  }
  h += '<div class="order-line"><span>' + freteLabel + '</span><span>' + (frete === 0 ? '<span style="color:var(--green);font-weight:600">Grátis</span>' : 'R$ ' + formatMoney(frete)) + '</span></div>';
  if (state.frete.calculado && state.frete.prazo) {
    h += '<div class="order-line"><span>Prazo estimado</span><span style="font-weight:600;color:var(--blue)">' + state.frete.prazo + '</span></div>';
  }
  // Cupom
  var descontoCupom = 0;
  var freteAjustado = frete;
  if (!state.cupomAplicado) {
    h += '<div class="coupon-row"><input type="text" id="cupom-input" placeholder="Cupom de desconto" onkeydown="if(event.key===\'Enter\')aplicarCupom()"><button onclick="aplicarCupom()">Aplicar</button></div>';
    if (state.cupomErro) h += '<div class="coupon-error">⚠️ ' + state.cupomErro + '</div>';
  } else {
    var cup = state.cupomAplicado;
    if (cup.tipo === 'percent') descontoCupom = subtotal * (cup.valor/100);
    else if (cup.tipo === 'fixed') descontoCupom = cup.valor;
    else if (cup.tipo === 'frete') { freteAjustado = 0; descontoCupom = 0; }
    h += '<div class="coupon-applied">';
    h += '<div class="left"><span class="code">' + cup.codigo + '</span><span class="desc">' + cup.desc + '</span></div>';
    h += '<span class="remove" onclick="removerCupom()">Remover ×</span>';
    h += '</div>';
    if (cup.tipo === 'frete') {
      h += '<div class="order-line"><span>Cupom: ' + cup.codigo + '</span><span style="color:var(--green);font-weight:600">Frete grátis</span></div>';
    } else {
      h += '<div class="order-line"><span>Cupom: ' + cup.codigo + '</span><span style="color:var(--green);font-weight:600">-R$ ' + formatMoney(descontoCupom) + '</span></div>';
    }
  }
  // Cashback toggle
  var cashbackUso = 0;
  var saldoCb = (state.logged && state.user && state.user.cashback) ? state.user.cashback : 0;
  if (saldoCb > 0) {
    var subAposCupom = subtotal - descontoCupom;
    var maxUso = Math.min(saldoCb, subAposCupom);
    if (state.useCashback) cashbackUso = maxUso;
    h += '<div class="cb-toggle"><input type="checkbox"' + (state.useCashback?' checked':'') + ' onclick="state.useCashback=this.checked;render()">';
    h += '<div class="cb-text">Usar meu cashback <strong>(R$ ' + formatMoney(saldoCb) + ' disponível)</strong></div></div>';
    if (state.useCashback) {
      h += '<div class="order-line"><span>Cashback aplicado</span><span style="color:var(--green);font-weight:600">-R$ ' + formatMoney(cashbackUso) + '</span></div>';
    }
  }
  var totalSemCb = subtotal + freteAjustado - descontoCupom - cashbackUso;
  if (state.checkoutPay === 'pix') h += '<div class="order-line"><span>Desconto Pix (5%)</span><span style="color:var(--green)">-R$ ' + formatMoney(totalSemCb * 0.05) + '</span></div>';
  var totalFinal = state.checkoutPay === 'pix' ? totalSemCb * 0.95 : totalSemCb;
  var cashbackGanho = subtotal * CASHBACK_PCT;
  // Tributos inclusos (Lei 12.741/2012)
  var totalTributos = state.cart.reduce(function(s,i){
    var p = ALL_PRODUCTS.find(function(x){return x.id===i.pid;});
    if (!p || !p.ncm) return s;
    return s + (p.price * i.qty * (p.icms + p.ipi + p.pis + p.cofins) / 100);
  },0);
  h += '<div class="order-line" style="font-size:11px;color:var(--gray-400)"><span>📋 Tributos inclusos (Lei 12.741)</span><span>R$ ' + formatMoney(totalTributos) + '</span></div>';
  h += '<div class="order-line"><span>💰 Você ganhará de cashback</span><span style="color:var(--green);font-weight:700">+R$ ' + formatMoney(cashbackGanho) + '</span></div>';
  h += '<div class="order-line total"><span>Total</span><span>R$ ' + formatMoney(totalFinal) + '</span></div>';
  h += '<button class="btn btn-orange btn-lg btn-block" style="margin-top:16px" onclick="finalizarPedido()">Finalizar Pedido</button>';
  h += '<p style="font-size:11px;color:var(--gray-400);text-align:center;margin-top:12px">🔒 Pagamento 100% seguro</p>';
  h += '</div></div>';
  h += '</div>';
  return h;
}

    h += '<div class="podium-value">R$ ' + formatMoney(s.vendas) + '</div>';

    h += '<div class="podium-progress"><div class="podium-progress-bar" style="width:' + pct + '%"></div></div>';

  });

    h += '<div class="seller-meta">' + s.role + ' · ' + s.pedidos + ' pedidos</div></div></div>';
    h += '<div class="seller-bar"><div class="seller-bar-track"><div class="seller-bar-fill" style="width:' + pct + '%;background:' + s.cor + '"></div></div><div class="seller-pct">' + Math.round(pct) + '% de R$ ' + (s.meta/1000) + 'k</div></div>';

    h += '</div>';
  });
  h += '</div>';
  return h;
}

function gerarCodigoIndicacao(nome) {
  var primeiro = (nome || 'CLIENTE').split(' ')[0].toUpperCase().replace(/[^A-Z]/g,'');
  var hash = 0;
  for (var i = 0; i < (nome || '').length; i++) hash = ((hash << 5) - hash) + nome.charCodeAt(i);
  var num = Math.abs(hash) % 900 + 100;
  return primeiro + '-' + num;
}

function copiarTexto(txt) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(txt).then(function(){ alert('Copiado: ' + txt); });
  } else {
    var ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    alert('Copiado: ' + txt);
  }
}

function aplicarCupom() {
  var input = document.getElementById('cupom-input');
  if (!input) return;
  var codigo = input.value.toUpperCase().trim();
  state.cupomErro = '';
  if (!codigo) { state.cupomErro = 'Digite um código de cupom'; render(); return; }

  var cupom = CUPONS.find(function(c){return c.codigo === codigo;});
  if (!cupom) { state.cupomErro = 'Cupom inválido ou expirado'; render(); return; }
  if (!cupom.ativo) { state.cupomErro = 'Este cupom não está ativo'; render(); return; }

  var subtotal = state.cart.reduce(function(s,i){var p=ALL_PRODUCTS.find(function(x){return x.id===i.pid;});return s+(p?p.price*i.qty:0);},0);
  if (subtotal < cupom.minimo) { state.cupomErro = 'Valor mínimo de R$ ' + formatMoney(cupom.minimo) + ' não atingido'; render(); return; }

  state.cupomAplicado = cupom;
  state.cupomErro = '';
  render();
}

function addToCart(pid) {
  var existing = state.cart.find(function(i){return i.pid===pid;});
  if (existing) existing.qty++;
  else state.cart.push({pid:pid, qty:1});
  var p = ALL_PRODUCTS.find(function(x){return x.id===pid;});
  if (p && p.stock > 0) p.stock--;
  render();
}
function changeQty(idx, delta) {
  state.cart[idx].qty += delta;
  var p = ALL_PRODUCTS.find(function(x){return x.id===state.cart[idx].pid;});
  if (delta > 0 && p) p.stock--;
  if (delta < 0 && p) p.stock++;
  if (state.cart[idx].qty <= 0) state.cart.splice(idx, 1);
  render();
}
function removeFromCart(idx) {
  var item = state.cart[idx];
  var p = ALL_PRODUCTS.find(function(x){return x.id===item.pid;});
  if (p) p.stock += item.qty;
  state.cart.splice(idx, 1);
  render();
}

function finalizarPedido() {
  if (!state.logged) { openModal('login'); return; }
  if (!state.frete.calculado || !state.frete.opcao) { alert('Por favor, calcule o frete antes de finalizar o pedido.'); return; }
  var subtotal = state.cart.reduce(function(s,i){var p=ALL_PRODUCTS.find(function(x){return x.id===i.pid;});return s+(p?p.price*i.qty:0);},0);
  var frete = state.frete.valor;
  var descontoCupom = 0;
  if (state.cupomAplicado) {
    var cup = state.cupomAplicado;
    if (cup.tipo === 'percent') descontoCupom = subtotal * (cup.valor/100);
    else if (cup.tipo === 'fixed') descontoCupom = cup.valor;
    else if (cup.tipo === 'frete') frete = 0;
    cup.usos = (cup.usos || 0) + 1;
  }
  var saldoCb = state.user.cashback || 0;
  var cashbackUso = state.useCashback ? Math.min(saldoCb, subtotal - descontoCupom) : 0;
  var totalSemCb = subtotal + frete - descontoCupom - cashbackUso;
  var total = state.checkoutPay === 'pix' ? totalSemCb * 0.95 : totalSemCb;
  var cashbackGanho = subtotal * CASHBACK_PCT;
  var opNome = {sedex:'SEDEX',pac:'PAC',expresso:'SEDEX 10'};

  // Atribui vendedor (rotativo, exclui Diego — Júnior só atende presencial nessa demo)
  var vendedoresAtivos = VENDEDORES.slice(0, 6);
  var vendedor = vendedoresAtivos[state.orders.length % vendedoresAtivos.length];
  vendedor.vendas += total;
  vendedor.pedidos += 1;

  var orderId = 1048 + state.orders.length;
  var order = {
    id: orderId,
    date: new Date().toLocaleDateString('pt-BR'),
    items: state.cart.map(function(i){var p=ALL_PRODUCTS.find(function(x){return x.id===i.pid;});return{name:p?p.name:'',qty:i.qty,price:p?p.price:0};}),
    total: total,
    subtotal: subtotal,
    frete: frete,
    cashbackUsado: cashbackUso,
    cashbackGanho: cashbackGanho,
    vendedor: vendedor.nome,
    vendedorId: vendedor.id,
    freteModalidade: opNome[state.frete.opcao] || state.frete.opcao,
    fretePrazo: state.frete.prazo,
    pay: state.checkoutPay === 'pix' ? 'Pix' : state.checkoutPay === 'cartao' ? 'Cartão' : 'Boleto',
    status: 'Processando',
    statusClass: 'status-blue',
    cliente: state.user.nome
  };

  // Atualiza saldo de cashback do user
  state.user.cashback = saldoCb - cashbackUso + cashbackGanho;
  if (cashbackUso > 0) {
    state.cashbackHistory.unshift({data:order.date, tipo:'out', desc:'Resgate no pedido #' + orderId, valor: cashbackUso});
  }
  state.cashbackHistory.unshift({data:order.date, tipo:'in', desc:'Crédito do pedido #' + orderId, valor: cashbackGanho});

  order.cupomCodigo = state.cupomAplicado ? state.cupomAplicado.codigo : null;
  order.descontoCupom = descontoCupom;
  state.orders.push(order);
  state.cart = [];
  state.frete = { cep: '', opcao: '', valor: 0, prazo: '', calculado: false };
  state.useCashback = false;
  state.cupomAplicado = null;
  state.cupomErro = '';
  state.view = 'client';
  state.clientView = 'pedidos';
  render();
  var msg = '✅ Pedido #' + order.id + ' realizado com sucesso!\n\n';
  msg += 'Total: R$ ' + formatMoney(order.total) + '\n';
  msg += 'Pagamento: ' + order.pay + '\n';
  msg += 'Vendedor responsável: ' + vendedor.nome + '\n';
  msg += 'Entrega: ' + order.freteModalidade + ' — ' + order.fretePrazo + '\n';
  if (cashbackUso > 0) msg += '\n💰 Cashback usado: R$ ' + formatMoney(cashbackUso);
  msg += '\n💰 Cashback ganho: R$ ' + formatMoney(cashbackGanho) + '\n💰 Saldo atual: R$ ' + formatMoney(state.user.cashback);
  alert(msg);
}

(function loadSavedLogo() {
  var saved = localStorage.getItem('zm_logo_src');
  var savedZoom = localStorage.getItem('zm_logo_zoom');
  if (saved) state.logoSrc = saved;
  if (savedZoom) state.logoZoom = parseFloat(savedZoom);
})();

function formatMoney(v) { return Number(v).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}); }
function escHtml(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// =============================================
// FRETE — SIMULAÇÃO CORREIOS
// =============================================
var FRETE_CACHE = {};

function calcularFrete(cepInput, callback) {
  var cep = (cepInput || '').replace(/\D/g, '');
  if (cep.length !== 8) { alert('CEP inválido. Digite 8 dígitos.'); return; }

  if (FRETE_CACHE[cep]) { callback(FRETE_CACHE[cep]); return; }

  var btn = document.getElementById('btn-calc-frete');
  if (btn) { btn.textContent = 'Calculando...'; btn.disabled = true; }

  fetch('https://viacep.com.br/ws/' + cep + '/json/')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.erro) { alert('CEP não encontrado. Verifique e tente novamente.'); resetFreteBtn(); return; }

      var subtotal = state.cart.reduce(function(s,i){var p=ALL_PRODUCTS.find(function(x){return x.id===i.pid;});return s+(p?p.price*i.qty:0);},0);
      var totalItens = state.cart.reduce(function(s,i){return s+i.qty;},0);
      var peso = Math.max(0.3, totalItens * 0.5);

      var dist = calcDistanciaPorUF(data.uf);
      var baseSedex = 15.90 + (dist * 1.8) + (peso * 2.5);
      var basePAC = 12.50 + (dist * 0.9) + (peso * 1.5);
      var baseExpresso = 28.90 + (dist * 2.8) + (peso * 3.2);

      baseSedex = Math.round(baseSedex * 100) / 100;
      basePAC = Math.round(basePAC * 100) / 100;
      baseExpresso = Math.round(baseExpresso * 100) / 100;

      var freteGratis = subtotal >= 299;
      var prazoBase = Math.max(1, Math.round(dist / 3));

      var resultado = {
        cep: cep,
        endereco: data.logradouro ? (data.logradouro + ', ' + data.bairro + ' — ' + data.localidade + '/' + data.uf) : (data.localidade + '/' + data.uf),
        cidade: data.localidade,
        uf: data.uf,
        opcoes: [
          { id: 'sedex', nome: 'SEDEX', prazo: prazoBase + ' a ' + (prazoBase + 2) + ' dias úteis', valor: freteGratis ? 0 : baseSedex, icon: '📦' },
          { id: 'pac', nome: 'PAC — Encomenda', prazo: (prazoBase + 3) + ' a ' + (prazoBase + 7) + ' dias úteis', valor: freteGratis ? 0 : basePAC, icon: '📬' },
          { id: 'expresso', nome: 'SEDEX 10 — Expressa', prazo: prazoBase <= 1 ? '1 dia útil' : '1 a ' + prazoBase + ' dias úteis', valor: freteGratis ? 0 : baseExpresso, icon: '⚡' }
        ]
      };

      FRETE_CACHE[cep] = resultado;
      callback(resultado);
      resetFreteBtn();
    })
    .catch(function() {
      var resultado = freteSimuladoFallback(cep);
      FRETE_CACHE[cep] = resultado;
      callback(resultado);
      resetFreteBtn();
    });
}

function calcDistanciaPorUF(uf) {
  var distancias = {
    'MG':0,'SP':2,'RJ':3,'ES':2,'GO':1,'DF':2,'MS':3,'MT':4,
    'BA':4,'SE':5,'AL':5,'PE':6,'PB':6,'RN':6,'CE':7,'PI':7,'MA':8,
    'PA':9,'AP':10,'AM':10,'RR':11,'AC':11,'RO':8,'TO':5,
    'PR':3,'SC':4,'RS':5
  };
  return distancias[uf] || 5;
}

function freteSimuladoFallback(cep) {
  var region = parseInt(cep.charAt(0));
  var dist = [0,3,4,5,2,4,6,7,8,1][region] || 5;
  return {
    cep: cep,
    endereco: 'CEP ' + cep.replace(/(\d{5})(\d{3})/, '$1-$2'),
    cidade: '',
    uf: '',
    opcoes: [
      { id: 'sedex', nome: 'SEDEX', prazo: (dist+1) + ' a ' + (dist+3) + ' dias úteis', valor: Math.round((15.90 + dist*1.8)*100)/100, icon: '📦' },
      { id: 'pac', nome: 'PAC — Encomenda', prazo: (dist+4) + ' a ' + (dist+8) + ' dias úteis', valor: Math.round((12.50 + dist*0.9)*100)/100, icon: '📬' },
      { id: 'expresso', nome: 'SEDEX 10 — Expressa', prazo: dist <= 1 ? '1 dia útil' : '1 a ' + (dist+1) + ' dias úteis', valor: Math.round((28.90 + dist*2.8)*100)/100, icon: '⚡' }
    ]
  };
}

function resetFreteBtn() {
  var btn = document.getElementById('btn-calc-frete');
  if (btn) { btn.textContent = 'Calcular'; btn.disabled = false; }
}

function selecionarFrete(opcaoId) {
  var cached = FRETE_CACHE[state.frete.cep];
  if (!cached) return;
  var opc = cached.opcoes.find(function(o) { return o.id === opcaoId; });
  if (!opc) return;
  state.frete.opcao = opc.id;
  state.frete.valor = opc.valor;
  state.frete.prazo = opc.prazo;
  render();
}

function renderFreteCalc(contexto) {
  var h = '<div class="frete-calc">';
  h += '<div class="frete-calc-title">🚚 Calcular frete e prazo de entrega</div>';
  h += '<div class="frete-input-row">';
  h += '<input type="text" id="frete-cep-input" placeholder="Digite seu CEP" maxlength="9" value="' + (state.frete.cep || '') + '" onkeyup="this.value=this.value.replace(/\\D/g,\'\').replace(/(\\d{5})(\\d)/,\'$1-$2\')" onkeydown="if(event.key===\'Enter\'){document.getElementById(\'btn-calc-frete\').click()}">';
  h += '<button id="btn-calc-frete" onclick="var c=document.getElementById(\'frete-cep-input\').value;state.frete.cep=c.replace(/\\D/g,\'\');calcularFrete(c,function(r){state.frete.calculado=true;if(!state.frete.opcao&&r.opcoes.length)selecionarFrete(r.opcoes[0].id);else render();})">Calcular</button>';
  h += '</div>';

  if (state.frete.calculado && FRETE_CACHE[state.frete.cep]) {
    var dados = FRETE_CACHE[state.frete.cep];
    h += '<div class="frete-opcoes">';
    dados.opcoes.forEach(function(opc) {
      var sel = state.frete.opcao === opc.id ? ' selected' : '';
      h += '<div class="frete-opcao' + sel + '" onclick="selecionarFrete(\'' + opc.id + '\')">';
      h += '<div class="frete-radio"></div>';
      h += '<div style="font-size:18px">' + opc.icon + '</div>';
      h += '<div class="frete-info"><div class="frete-nome">' + opc.nome + '</div>';
      h += '<div class="frete-prazo">Receba em ' + opc.prazo + '</div></div>';
      h += '<div class="frete-preco' + (opc.valor === 0 ? ' gratis' : '') + '">' + (opc.valor === 0 ? 'Grátis' : 'R$ ' + formatMoney(opc.valor)) + '</div>';
      h += '</div>';
    });
    h += '</div>';
    if (dados.endereco) {
      h += '<div class="frete-endereco">📍 Entrega para: <strong>' + escHtml(dados.endereco) + '</strong></div>';
    }
  }
  h += '</div>';
  return h;
}

  return '<footer class="footer"><div class="container">' +
    '<div class="footer-grid">' +
    '<div><img src="logo-zm.png" alt="ZM Atacadista" style="height:50px;margin-bottom:12px;filter:brightness(0) invert(1)"><p>Referência em atacado e material de construção. Mais de 2.000 produtos para PF e PJ com entrega para todo Brasil.</p></div>' +
    '<div><h3>Institucional</h3><a href="#">Sobre Nós</a><br><a href="#">Trabalhe Conosco</a><br><a href="#">Política de Privacidade</a><br><a href="#">Termos de Uso</a></div>' +
    '<div><h3>Atendimento</h3><a href="#">Central de Ajuda</a><br><a href="#">WhatsApp: (34) 98428-2779</a><br><a href="#">SAC: 0800 727 0909</a><br><a href="#">Trocas e Devoluções</a></div>' +
    '<div><h3>Formas de Pagamento</h3><div class="footer-payments"><span>PIX</span><span>VISA</span><span>MASTER</span><span>ELO</span><span>BOLETO</span></div><br><h3 style="margin-top:12px">Segurança</h3><p>🔒 Site 100% seguro<br>Certificado SSL</p></div>' +
    '</div>' +
    '<div class="footer-bottom"><span>© 2026 ZM Atacadista e Material de Construção. Todos os direitos reservados. CNPJ: 25.456.789/0001-90</span><span>Desenvolvido por Informus</span></div>' +
    '</div></footer>';
}

// Close logo editor on outside click
document.addEventListener('click', function(e) {
  if (state.logoEditorOpen && !e.target.closest('.header-logo')) {
    state.logoEditorOpen = false;
    render();
  }
});

// INIT
render();
</script>
