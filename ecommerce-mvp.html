<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZM — Atacadista e Material de Construção</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23E20031'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='system-ui' font-weight='900' font-size='28' fill='%23fff'%3EZM%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --blue: #E20031;
  --blue-dark: #B8002A;
  --blue-light: #FDEAEF;
  --blue-50: #FEF5EA;
  --orange: #e7193e;
  --orange-dark: #B8002A;
  --orange-light: #FEF5EA;
  --white: #FFFFFF;
  --gray-50: #FEF5EA;
  --gray-100: #F5EDE0;
  --gray-200: #E5E7EB;
  --gray-300: #D1D5DB;
  --gray-400: #9CA3AF;
  --gray-500: #6B7280;
  --gray-600: #4B5563;
  --gray-700: #374151;
  --gray-800: #1F2937;
  --gray-900: #111827;
  --green: #059669;
  --green-light: #ECFDF5;
  --red: #DC2626;
  --red-light: #FEF2F2;
  --yellow: #D97706;
  --yellow-light: #FFFBEB;
  --radius: 12px;
  --radius-sm: 8px;
  --radius-xs: 6px;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 6px rgba(0,0,0,0.05), 0 2px 4px rgba(0,0,0,0.03);
  --shadow-lg: 0 10px 25px rgba(0,0,0,0.08), 0 4px 10px rgba(0,0,0,0.04);
  --shadow-xl: 0 20px 40px rgba(0,0,0,0.1);
  --transition: all 0.2s cubic-bezier(0.4,0,0.2,1);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',system-ui,sans-serif;background:#FEF5EA;color:var(--gray-900);-webkit-font-smoothing:antialiased;line-height:1.5;}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;cursor:pointer;border:none;outline:none;}
input,select,textarea{font-family:inherit;outline:none;}
img{max-width:100%;display:block;}

/* SCROLLBAR */
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--gray-300);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:var(--gray-400);}

/* TOP BAR */
.top-bar{background:#1a1a1a;color:var(--gray-400);font-size:12px;padding:6px 0;letter-spacing:0.02em;}
.top-bar .container{display:flex;justify-content:space-between;align-items:center;}
.top-bar a{color:var(--gray-300);transition:var(--transition);}
.top-bar a:hover{color:#fff;}

/* HEADER */
.header{background:#FEF5EA;padding:14px 0;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,0.06);border-bottom:1px solid rgba(226,0,49,0.08);}
.header .container{display:flex;align-items:center;gap:16px;}
.h-btn-home{width:42px;height:42px;border-radius:var(--radius-sm);background:rgba(226,0,49,0.06);color:#E20031;display:flex;align-items:center;justify-content:center;transition:var(--transition);flex-shrink:0;}
.h-btn-home:hover{background:rgba(226,0,49,0.14);color:#B8002A;transform:scale(1.05);}
.header-logo{display:flex;align-items:center;gap:10px;white-space:nowrap;position:relative;cursor:pointer;}
.header-logo .logo-container{height:56px;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative;}
.header-logo .logo-container img{height:100%;width:auto;object-fit:contain;transform-origin:center;transition:transform 0.2s;}
.header-logo .logo-edit-hint{position:absolute;inset:0;background:rgba(226,0,49,0.7);color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 0.2s;border-radius:6px;pointer-events:none;}
.header-logo:hover .logo-edit-hint{opacity:1;}
.logo-zoom-panel{position:absolute;top:calc(100% + 8px);left:0;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:16px;z-index:200;min-width:280px;border:1px solid var(--gray-200);}
.logo-zoom-panel .zoom-preview{width:250px;height:120px;overflow:hidden;border-radius:var(--radius-sm);background:#FEF5EA;display:flex;align-items:center;justify-content:center;margin-bottom:12px;border:1px solid var(--gray-200);}
.logo-zoom-panel .zoom-preview img{transform-origin:center;transition:transform 0.15s;}
.logo-zoom-panel label{font-size:12px;font-weight:600;color:var(--gray-600);display:block;margin-bottom:6px;}
.logo-zoom-panel input[type="range"]{width:100%;accent-color:#E20031;margin-bottom:12px;}
.logo-zoom-panel .zoom-actions{display:flex;gap:8px;}
.logo-zoom-panel .zoom-actions button{flex:1;padding:8px;border-radius:var(--radius-xs);font-size:12px;font-weight:600;}
.logo-zoom-panel .btn-upload{background:rgba(226,0,49,0.08);color:#E20031;border:1px solid rgba(226,0,49,0.15);}
.logo-zoom-panel .btn-upload:hover{background:rgba(226,0,49,0.15);}
.logo-zoom-panel .btn-save{background:#E20031;color:#fff;}
.logo-zoom-panel .btn-save:hover{background:#B8002A;}
.search-wrap{flex:1;max-width:640px;position:relative;}
.search-wrap input{width:100%;padding:12px 48px 12px 18px;border:2px solid var(--gray-200);border-radius:999px;font-size:14px;background:#fff;color:var(--gray-900);transition:var(--transition);}
.search-wrap input:focus{border-color:#E20031;box-shadow:0 0 0 3px rgba(226,0,49,0.08);}
.search-wrap input::placeholder{color:var(--gray-400);}
.search-wrap button{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:#E20031;color:#fff;border:none;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:var(--transition);}
.search-wrap button:hover{background:#B8002A;}
.header-actions{display:flex;align-items:center;gap:8px;margin-left:auto;}
.h-btn{display:flex;align-items:center;gap:8px;color:var(--gray-700);font-size:13px;font-weight:600;padding:8px 14px;border-radius:var(--radius-sm);background:rgba(226,0,49,0.06);transition:var(--transition);white-space:nowrap;}
.h-btn:hover{background:rgba(226,0,49,0.12);color:#E20031;}
.h-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0;}
.h-btn .badge{background:#E20031;color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:99px;margin-left:2px;}

/* NAV */
.nav-bar{background:#fff;border-bottom:1px solid var(--gray-200);padding:0;overflow-x:auto;}
.nav-bar .container{display:flex;gap:0;}
.nav-item{padding:12px 18px;font-size:13px;font-weight:500;color:var(--gray-600);white-space:nowrap;cursor:pointer;border-bottom:2px solid transparent;transition:var(--transition);}
.nav-item:hover{color:#E20031;background:rgba(226,0,49,0.04);}
.nav-item.active{color:#E20031;border-bottom-color:#E20031;font-weight:600;}

/* CONTAINER */
.container{max-width:1280px;margin:0 auto;padding:0 24px;}

/* HERO BANNER */
.hero{padding:24px 0;}
.hero-grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;}
.hero-main{position:relative;border-radius:var(--radius);overflow:hidden;background:linear-gradient(135deg,#E20031,#F75263);min-height:320px;display:flex;align-items:center;padding:48px;color:#fff;}
.hero-main h2{font-size:36px;font-weight:900;letter-spacing:-0.03em;line-height:1.15;margin-bottom:12px;}
.hero-main p{font-size:16px;opacity:0.8;margin-bottom:24px;max-width:400px;}
.hero-main .hero-cta{display:inline-flex;align-items:center;gap:8px;background:#99CC00;color:#fff;padding:14px 28px;border-radius:999px;font-weight:700;font-size:14px;transition:var(--transition);text-shadow:0 1px 2px rgba(0,0,0,0.15);}
.hero-main .hero-cta:hover{background:#8DA91B;transform:translateY(-1px);}
.hero-side{display:flex;flex-direction:column;gap:16px;}
.hero-card{flex:1;border-radius:var(--radius);padding:28px;display:flex;flex-direction:column;justify-content:center;}
.hero-card:nth-child(1){background:linear-gradient(135deg,#8DA91B,#99CC00);color:#fff;}
.hero-card:nth-child(2){background:linear-gradient(135deg,#E20031,#F75263);color:#fff;}
.hero-card h3{font-size:18px;font-weight:800;margin-bottom:4px;}
.hero-card p{font-size:13px;opacity:0.85;}

/* SECTION */
.section{padding:32px 0;}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.section-header h2{font-size:20px;font-weight:800;letter-spacing:-0.02em;color:var(--gray-900);}
.section-header a{font-size:13px;font-weight:600;color:var(--blue);display:flex;align-items:center;gap:4px;}

/* PRODUCT GRID */
.product-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;}
.product-card{background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:var(--transition);cursor:pointer;position:relative;}
.product-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-3px);}
.product-img{width:100%;aspect-ratio:1;background:var(--gray-100);display:flex;align-items:center;justify-content:center;font-size:48px;position:relative;overflow:hidden;}
.product-img .tag{position:absolute;top:8px;left:8px;background:var(--orange);color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px;letter-spacing:0.02em;}
.product-img .tag-green{background:var(--green);}
.product-body{padding:14px;}
.product-cat{font-size:10px;font-weight:600;color:var(--blue);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px;}
.product-name{font-size:13px;font-weight:600;color:var(--gray-800);margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4;min-height:36px;}
.product-price-old{font-size:11px;color:var(--gray-400);text-decoration:line-through;}
.product-price{font-size:18px;font-weight:800;color:var(--green);margin:2px 0;}
.product-installment{font-size:11px;color:var(--gray-500);}
.product-actions{display:flex;gap:6px;margin-top:10px;}
.product-actions .btn-cart{flex:1;background:var(--blue);color:#fff;border:none;padding:8px;border-radius:var(--radius-xs);font-size:12px;font-weight:600;transition:var(--transition);display:flex;align-items:center;justify-content:center;gap:4px;}
.product-actions .btn-cart:hover{background:var(--blue-dark);}
.product-actions .btn-fav{width:34px;height:34px;background:var(--gray-100);border:none;border-radius:var(--radius-xs);display:flex;align-items:center;justify-content:center;transition:var(--transition);color:var(--gray-400);}
.product-actions .btn-fav:hover{background:var(--red-light);color:var(--red);}

/* CATEGORIES BAR */
.cat-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:12px;margin-bottom:8px;}
.cat-card{background:#fff;border-radius:var(--radius);padding:20px 14px;text-align:center;box-shadow:var(--shadow);cursor:pointer;transition:var(--transition);border:1px solid transparent;}
.cat-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);border-color:rgba(226,0,49,0.15);}
.cat-card .cat-icon{margin-bottom:10px;color:#E20031;display:flex;align-items:center;justify-content:center;}
.cat-card .cat-label{font-size:12px;font-weight:700;color:var(--gray-700);letter-spacing:-0.01em;}

/* PAGINATION */
.pagination{display:flex;justify-content:center;gap:6px;padding:32px 0;}
.pagination button{width:38px;height:38px;border-radius:var(--radius-xs);border:1px solid var(--gray-200);background:#fff;font-size:13px;font-weight:600;color:var(--gray-600);transition:var(--transition);}
.pagination button:hover{border-color:var(--blue);color:var(--blue);}
.pagination button.active{background:var(--blue);color:#fff;border-color:var(--blue);}

/* FOOTER */
.footer{background:#1a0005;color:rgba(255,255,255,0.5);padding:48px 0 24px;margin-top:48px;}
.footer-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:48px;margin-bottom:32px;}
.footer h3{color:#fff;font-size:14px;font-weight:700;margin-bottom:16px;}
.footer p,.footer a{font-size:13px;line-height:1.8;color:var(--gray-400);}
.footer a:hover{color:#fff;}
.footer-bottom{border-top:1px solid rgba(255,255,255,0.08);padding-top:24px;display:flex;justify-content:space-between;align-items:center;font-size:12px;}
.footer-payments{display:flex;gap:8px;}
.footer-payments span{background:rgba(255,255,255,0.06);padding:4px 10px;border-radius:4px;font-size:11px;font-weight:600;color:var(--gray-300);}

/* MODAL OVERLAY */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:500;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity 0.2s;}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow-xl);max-height:90vh;overflow-y:auto;width:100%;}
.modal-sm{max-width:440px;}
.modal-md{max-width:600px;}
.modal-lg{max-width:900px;}
.modal-xl{max-width:1100px;}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--gray-200);}
.modal-header h3{font-size:18px;font-weight:700;}
.modal-close{width:32px;height:32px;border-radius:8px;background:var(--gray-100);display:flex;align-items:center;justify-content:center;transition:var(--transition);color:var(--gray-500);}
.modal-close:hover{background:var(--gray-200);color:var(--gray-700);}
.modal-body{padding:24px;}
.modal-footer{padding:16px 24px;border-top:1px solid var(--gray-200);display:flex;gap:8px;justify-content:flex-end;}

/* FORMS */
.form-group{margin-bottom:16px;}
.form-label{display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px;}
.form-input{width:100%;padding:10px 14px;border:1px solid var(--gray-300);border-radius:var(--radius-xs);font-size:14px;transition:var(--transition);background:#fff;}
.form-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(7,42,216,0.1);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-tabs{display:flex;gap:0;margin-bottom:20px;border:1px solid var(--gray-200);border-radius:var(--radius-xs);overflow:hidden;}
.form-tab{flex:1;padding:10px;text-align:center;font-size:13px;font-weight:600;cursor:pointer;background:var(--gray-50);color:var(--gray-500);transition:var(--transition);}
.form-tab.active{background:var(--blue);color:#fff;}

/* BUTTONS */
.btn{padding:10px 20px;border-radius:var(--radius-xs);font-size:14px;font-weight:600;transition:var(--transition);display:inline-flex;align-items:center;gap:8px;justify-content:center;}
.btn-primary{background:var(--blue);color:#fff;}
.btn-primary:hover{background:var(--blue-dark);}
.btn-orange{background:var(--orange);color:#fff;}
.btn-orange:hover{background:var(--orange-dark);}
.btn-outline{background:#fff;color:var(--gray-700);border:1px solid var(--gray-300);}
.btn-outline:hover{border-color:var(--blue);color:var(--blue);}
.btn-green{background:var(--green);color:#fff;}
.btn-sm{padding:7px 14px;font-size:12px;}
.btn-lg{padding:14px 28px;font-size:15px;}
.btn-block{width:100%;}

/* CART DRAWER */
.cart-drawer{position:fixed;top:0;right:-420px;width:420px;height:100vh;background:#fff;z-index:600;box-shadow:-10px 0 40px rgba(0,0,0,0.15);transition:right 0.3s cubic-bezier(0.4,0,0.2,1);display:flex;flex-direction:column;}
.cart-drawer.open{right:0;}
.cart-drawer-header{padding:20px;border-bottom:1px solid var(--gray-200);display:flex;justify-content:space-between;align-items:center;}
.cart-drawer-header h3{font-size:18px;font-weight:800;}
.cart-drawer-body{flex:1;overflow-y:auto;padding:16px 20px;}
.cart-item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--gray-100);}
.cart-item-img{width:72px;height:72px;background:var(--gray-100);border-radius:var(--radius-xs);display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;}
.cart-item-info{flex:1;}
.cart-item-name{font-size:13px;font-weight:600;margin-bottom:4px;}
.cart-item-price{font-size:15px;font-weight:800;color:var(--green);}
.cart-item-qty{display:flex;align-items:center;gap:0;margin-top:6px;}
.cart-item-qty button{width:28px;height:28px;border:1px solid var(--gray-200);background:#fff;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--gray-600);}
.cart-item-qty button:first-child{border-radius:6px 0 0 6px;}
.cart-item-qty button:last-child{border-radius:0 6px 6px 0;}
.cart-item-qty span{width:36px;text-align:center;font-size:13px;font-weight:600;border-top:1px solid var(--gray-200);border-bottom:1px solid var(--gray-200);height:28px;line-height:28px;}
.cart-item-remove{color:var(--gray-400);font-size:11px;cursor:pointer;margin-top:4px;display:inline-block;}
.cart-item-remove:hover{color:var(--red);}
.cart-drawer-footer{padding:20px;border-top:1px solid var(--gray-200);background:var(--gray-50);}
.cart-total{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.cart-total .label{font-size:14px;color:var(--gray-500);}
.cart-total .value{font-size:22px;font-weight:900;color:var(--gray-900);}
.cart-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:550;opacity:0;pointer-events:none;transition:opacity 0.3s;}
.cart-overlay.open{opacity:1;pointer-events:all;}

/* CHECKOUT PAGE */
.checkout-wrap{display:grid;grid-template-columns:1.4fr 1fr;gap:32px;padding:32px 0;}
.checkout-section{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;margin-bottom:20px;}
.checkout-section h3{font-size:16px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.checkout-section h3 .step{width:28px;height:28px;background:var(--blue);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
.pay-method{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px;}
.pay-method-card{padding:16px;border:2px solid var(--gray-200);border-radius:var(--radius-sm);text-align:center;cursor:pointer;transition:var(--transition);}
.pay-method-card:hover{border-color:var(--blue);}
.pay-method-card.selected{border-color:var(--blue);background:var(--blue-50);}
.pay-method-card .pay-icon{font-size:28px;margin-bottom:6px;}
.pay-method-card .pay-label{font-size:12px;font-weight:600;color:var(--gray-700);}
.pix-area{text-align:center;padding:20px;}
.pix-qr{width:200px;height:200px;background:var(--gray-100);border-radius:var(--radius);margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--gray-500);border:2px dashed var(--gray-300);}
.boleto-area{text-align:center;padding:20px;}
.boleto-code{background:var(--gray-100);padding:12px;border-radius:var(--radius-xs);font-family:monospace;font-size:12px;word-break:break-all;margin-bottom:12px;}
.order-summary{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;position:sticky;top:100px;}
.order-summary h3{font-size:16px;font-weight:700;margin-bottom:16px;}
.order-line{display:flex;justify-content:space-between;padding:8px 0;font-size:13px;color:var(--gray-600);}
.order-line.total{border-top:2px solid var(--gray-200);margin-top:8px;padding-top:12px;font-size:18px;font-weight:800;color:var(--gray-900);}

/* AREA CLIENTE */
.client-layout{display:grid;grid-template-columns:240px 1fr;gap:24px;padding:32px 0;}
.client-sidebar{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;height:fit-content;position:sticky;top:100px;}
.client-avatar{width:64px;height:64px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;margin:0 auto 12px;}
.client-name{text-align:center;font-size:14px;font-weight:700;margin-bottom:4px;}
.client-doc{text-align:center;font-size:11px;color:var(--gray-400);margin-bottom:20px;}
.client-menu{list-style:none;}
.client-menu li{padding:10px 14px;font-size:13px;font-weight:500;color:var(--gray-600);border-radius:var(--radius-xs);cursor:pointer;transition:var(--transition);margin-bottom:2px;}
.client-menu li:hover{background:var(--gray-50);color:var(--gray-900);}
.client-menu li.active{background:var(--blue-50);color:var(--blue);font-weight:600;}
.client-content{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;}
.order-card{border:1px solid var(--gray-200);border-radius:var(--radius-sm);padding:16px;margin-bottom:12px;transition:var(--transition);}
.order-card:hover{border-color:var(--blue-light);box-shadow:var(--shadow-md);}
.order-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.order-id{font-size:14px;font-weight:700;}
.order-status{padding:4px 10px;border-radius:99px;font-size:11px;font-weight:700;}
.status-green{background:var(--green-light);color:var(--green);}
.status-yellow{background:var(--yellow-light);color:var(--yellow);}
.status-blue{background:var(--blue-light);color:var(--blue);}
.order-items-preview{font-size:12px;color:var(--gray-500);margin-bottom:8px;}
.order-bottom{display:flex;justify-content:space-between;font-size:13px;}
.order-bottom .date{color:var(--gray-400);}
.order-bottom .total{font-weight:700;color:var(--gray-900);}

/* ADMIN */
.admin-wrap{display:grid;grid-template-columns:240px 1fr;min-height:100vh;}
.admin-sidebar{background:var(--gray-900);color:#fff;padding:20px 14px;}
.admin-logo{font-size:18px;font-weight:900;color:#fff;padding:10px 14px;margin-bottom:24px;display:flex;align-items:center;gap:10px;}
.admin-logo small{font-size:10px;color:var(--gray-400);font-weight:500;}
.admin-nav{list-style:none;}
.admin-nav li{padding:10px 14px;font-size:13px;font-weight:500;color:rgba(255,255,255,0.5);border-radius:var(--radius-xs);cursor:pointer;transition:var(--transition);margin-bottom:2px;display:flex;align-items:center;gap:10px;}
.admin-nav li:hover{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.85);}
.admin-nav li.active{background:var(--blue);color:#fff;font-weight:600;}
.admin-nav li svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;}
.admin-content{padding:24px 32px;background:var(--gray-50);}
.admin-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
.admin-header h2{font-size:24px;font-weight:800;letter-spacing:-0.02em;}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
.stat-card{background:#fff;border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);}
.stat-card .stat-label{font-size:12px;font-weight:600;color:var(--gray-400);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;}
.stat-card .stat-value{font-size:28px;font-weight:900;letter-spacing:-0.02em;}
.stat-card .stat-change{font-size:12px;font-weight:600;margin-top:4px;}
.stat-card .stat-change.up{color:var(--green);}
.stat-card .stat-change.down{color:var(--red);}
.data-table{width:100%;border-collapse:collapse;}
.data-table th{text-align:left;font-size:11px;font-weight:600;color:var(--gray-400);text-transform:uppercase;letter-spacing:0.06em;padding:12px 16px;border-bottom:2px solid var(--gray-200);}
.data-table td{padding:12px 16px;font-size:13px;border-bottom:1px solid var(--gray-100);}
.data-table tr:hover td{background:var(--gray-50);}
.stock-low{color:var(--red);font-weight:700;}
.stock-ok{color:var(--green);font-weight:600;}

/* NF MODAL */
.nf-preview{background:#fff;border:1px solid var(--gray-200);padding:32px;font-family:'Courier New',monospace;font-size:12px;max-width:600px;margin:0 auto;}
.nf-header-block{border:2px solid #000;padding:12px;margin-bottom:16px;text-align:center;}
.nf-header-block h2{font-size:16px;font-weight:700;font-family:'Inter',sans-serif;}
.nf-table{width:100%;border-collapse:collapse;margin-bottom:16px;}
.nf-table th,.nf-table td{border:1px solid #999;padding:6px 8px;text-align:left;font-size:11px;}
.nf-table th{background:#eee;font-weight:700;}

/* FRETE CALCULATOR */
.frete-calc{margin-top:20px;padding:20px;background:var(--gray-50);border-radius:var(--radius-sm);border:1px solid var(--gray-200);}
.frete-calc-title{font-size:13px;font-weight:700;color:var(--gray-700);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.frete-input-row{display:flex;gap:8px;margin-bottom:12px;}
.frete-input-row input{flex:1;padding:10px 14px;border:1px solid var(--gray-200);border-radius:var(--radius-xs);font-size:13px;background:#fff;}
.frete-input-row input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(7,42,216,0.08);}
.frete-input-row button{padding:10px 20px;background:var(--blue);color:#fff;border-radius:var(--radius-xs);font-size:13px;font-weight:600;transition:var(--transition);white-space:nowrap;}
.frete-input-row button:hover{background:var(--blue-dark);}
.frete-opcoes{display:flex;flex-direction:column;gap:8px;}
.frete-opcao{display:flex;align-items:center;gap:12px;padding:12px 14px;border:2px solid var(--gray-200);border-radius:var(--radius-sm);cursor:pointer;transition:var(--transition);background:#fff;}
.frete-opcao:hover{border-color:var(--blue-light);background:var(--blue-50);}
.frete-opcao.selected{border-color:var(--blue);background:var(--blue-50);}
.frete-opcao .frete-radio{width:18px;height:18px;border:2px solid var(--gray-300);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.frete-opcao.selected .frete-radio{border-color:var(--blue);}
.frete-opcao.selected .frete-radio::after{content:'';width:10px;height:10px;background:var(--blue);border-radius:50%;}
.frete-opcao .frete-info{flex:1;}
.frete-opcao .frete-nome{font-size:13px;font-weight:600;color:var(--gray-800);}
.frete-opcao .frete-prazo{font-size:11px;color:var(--gray-400);margin-top:2px;}
.frete-opcao .frete-preco{font-size:14px;font-weight:800;color:var(--gray-900);white-space:nowrap;}
.frete-opcao .frete-preco.gratis{color:var(--green);}
.frete-endereco{font-size:12px;color:var(--gray-500);margin-top:10px;padding:8px 12px;background:#fff;border-radius:var(--radius-xs);border:1px solid var(--gray-100);}

/* VIEWS */
.view{display:none;}
.view.active{display:block;}

/* RESPONSIVE */
@media(max-width:768px){
  .product-grid{grid-template-columns:repeat(2,1fr);}
  .cat-grid{grid-template-columns:repeat(4,1fr);}
  .hero-grid{grid-template-columns:1fr;}
  .hero-side{flex-direction:row;}
  .checkout-wrap{grid-template-columns:1fr;}
  .client-layout{grid-template-columns:1fr;}
  .admin-wrap{grid-template-columns:1fr;}
  .stat-grid{grid-template-columns:repeat(2,1fr);}
  .footer-grid{grid-template-columns:1fr 1fr;}
}

function generateProducts() {
  var products = [];
  var id = 1;
  CATEGORIES.forEach(function(cat) {
    var names = PRODUCT_NAMES[cat.id];
    var emojis = EMOJIS[cat.id];
    names.forEach(function(name, i) {
      var basePrice = Math.round((Math.random() * 800 + 15) * 100) / 100;
      var hasDiscount = Math.random() > 0.6;
      var discount = hasDiscount ? Math.round(Math.random() * 30 + 5) : 0;
      var price = hasDiscount ? Math.round(basePrice * (1 - discount/100) * 100) / 100 : basePrice;
      var stock = Math.floor(Math.random() * 500) + 1;
      products.push({
        id: id++,
        name: name,
        cat: cat.id,
        catLabel: cat.label,
        sub: cat.subs[i % cat.subs.length],
        emoji: emojis[i % emojis.length],
        price: price,
        oldPrice: hasDiscount ? basePrice : 0,
        discount: discount,
        stock: stock,
        sold: Math.floor(Math.random() * 200),
        rating: (Math.random() * 2 + 3).toFixed(1),
        atacado: Math.random() > 0.5,
        installment: price > 100 ? Math.ceil(price / 12) : 0
      });
    });
  });
  // Pad to ~2000
  while (products.length < 2000) {
    var src = products[Math.floor(Math.random() * 240)];
    var clone = JSON.parse(JSON.stringify(src));
    clone.id = id++;
    clone.name = src.name + ' ' + ['Premium','Plus','Pro','Max','Lite','Slim','Ultra','Mega','Master','Extra'][Math.floor(Math.random()*10)];
    clone.price = Math.round((src.price * (0.8 + Math.random() * 0.4)) * 100) / 100;
    clone.stock = Math.floor(Math.random() * 300) + 1;
    products.push(clone);
  }
  return products;
}

function render() {
  var app = document.getElementById('app');
  if (state.view === 'admin') { app.innerHTML = renderAdmin(); return; }
  var h = '';
  h += renderTopBar();
  h += renderHeader();
  if (state.view !== 'checkout') h += renderNav();
  h += '<main class="container">';
  if (state.view === 'home') h += renderHome();
  else if (state.view === 'catalog') h += renderCatalog();
  else if (state.view === 'checkout') h += renderCheckout();
  else if (state.view === 'client') h += renderClientArea();
  else if (state.view === 'product') h += renderProductDetail();
  h += '</main>';
  h += renderFooter();
  app.innerHTML = h;
  renderCartDrawer();
  updateCartOverlay();
}

function renderCatalog() {
  var h = '';
  var filtered = ALL_PRODUCTS.filter(function(p) {
    if (state.catFilter && p.cat !== state.catFilter) return false;
    if (state.search) {
      var s = state.search.toLowerCase();
      return p.name.toLowerCase().indexOf(s) >= 0 || p.catLabel.toLowerCase().indexOf(s) >= 0 || p.sub.toLowerCase().indexOf(s) >= 0;
    }
    return true;
  });
  var totalPages = Math.ceil(filtered.length / state.perPage);
  var start = (state.page - 1) * state.perPage;
  var pageItems = filtered.slice(start, start + state.perPage);

  var catName = state.catFilter ? CATEGORIES.find(function(c){return c.id===state.catFilter;}).label : 'Todos os Produtos';
  h += '<div class="section"><div class="section-header"><h2>' + catName + (state.search ? ' — "' + escHtml(state.search) + '"' : '') + '</h2>';
  h += '<span style="font-size:13px;color:var(--gray-400)">' + filtered.length + ' produtos encontrados</span></div>';
  h += '<div class="product-grid">';
  pageItems.forEach(function(p) { h += productCard(p); });
  h += '</div>';

  if (totalPages > 1) {
    h += '<div class="pagination">';
    for (var i = 1; i <= Math.min(totalPages, 10); i++) {
      h += '<button class="' + (i===state.page?'active':'') + '" onclick="goPage(' + i + ')">' + i + '</button>';
    }
    if (totalPages > 10) h += '<button onclick="goPage(' + totalPages + ')">' + totalPages + '</button>';
    h += '</div>';
  }
  h += '</div>';
  return h;
}

function productCard(p) {
  var h = '<div class="product-card" onclick="openProduct(' + p.id + ')">';
  h += '<div class="product-img">' + p.emoji;
  if (p.discount) h += '<span class="tag">-' + p.discount + '%</span>';
  if (p.atacado) h += '<span class="tag tag-green" style="left:auto;right:8px">Atacado</span>';
  h += '</div><div class="product-body">';
  h += '<div class="product-cat">' + escHtml(p.sub) + '</div>';
  h += '<div class="product-name">' + escHtml(p.name) + '</div>';
  if (p.oldPrice) h += '<div class="product-price-old">R$ ' + formatMoney(p.oldPrice) + '</div>';
  h += '<div class="product-price">R$ ' + formatMoney(p.price) + '</div>';
  if (p.installment) h += '<div class="product-installment">até 12x de R$ ' + formatMoney(p.installment) + '</div>';
  h += '<div class="product-actions">';
  h += '<button class="btn-cart" onclick="event.stopPropagation();addToCart(' + p.id + ')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg> Comprar</button>';

function renderCheckout() {

function navigate(view) { state.view = view; state.page = 1; window.scrollTo(0,0); render(); }

function addToCart(pid) {
  var existing = state.cart.find(function(i){return i.pid===pid;});
  if (existing) existing.qty++;
  else state.cart.push({pid:pid, qty:1});
  var p = ALL_PRODUCTS.find(function(x){return x.id===pid;});
  if (p && p.stock > 0) p.stock--;
  render();
}
function changeQty(idx, delta) {
  state.cart[idx].qty += delta;
  var p = ALL_PRODUCTS.find(function(x){return x.id===state.cart[idx].pid;});
  if (delta > 0 && p) p.stock--;
  if (delta < 0 && p) p.stock++;
  if (state.cart[idx].qty <= 0) state.cart.splice(idx, 1);
  render();
}
function removeFromCart(idx) {
  var item = state.cart[idx];
  var p = ALL_PRODUCTS.find(function(x){return x.id===item.pid;});
  if (p) p.stock += item.qty;
  state.cart.splice(idx, 1);
  render();
}

// FRETE — SIMULAÇÃO CORREIOS
// =============================================
var FRETE_CACHE = {};

function calcularFrete(cepInput, callback) {
  var cep = (cepInput || '').replace(/\D/g, '');
  if (cep.length !== 8) { alert('CEP inválido. Digite 8 dígitos.'); return; }

  if (FRETE_CACHE[cep]) { callback(FRETE_CACHE[cep]); return; }

  var btn = document.getElementById('btn-calc-frete');
  if (btn) { btn.textContent = 'Calculando...'; btn.disabled = true; }

  fetch('https://viacep.com.br/ws/' + cep + '/json/')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.erro) { alert('CEP não encontrado. Verifique e tente novamente.'); resetFreteBtn(); return; }

      var subtotal = state.cart.reduce(function(s,i){var p=ALL_PRODUCTS.find(function(x){return x.id===i.pid;});return s+(p?p.price*i.qty:0);},0);
      var totalItens = state.cart.reduce(function(s,i){return s+i.qty;},0);
      var peso = Math.max(0.3, totalItens * 0.5);

      var dist = calcDistanciaPorUF(data.uf);
      var baseSedex = 15.90 + (dist * 1.8) + (peso * 2.5);
      var basePAC = 12.50 + (dist * 0.9) + (peso * 1.5);
      var baseExpresso = 28.90 + (dist * 2.8) + (peso * 3.2);

      baseSedex = Math.round(baseSedex * 100) / 100;
      basePAC = Math.round(basePAC * 100) / 100;
      baseExpresso = Math.round(baseExpresso * 100) / 100;

      var freteGratis = subtotal >= 299;
      var prazoBase = Math.max(1, Math.round(dist / 3));

      var resultado = {
        cep: cep,
        endereco: data.logradouro ? (data.logradouro + ', ' + data.bairro + ' — ' + data.localidade + '/' + data.uf) : (data.localidade + '/' + data.uf),
        cidade: data.localidade,
        uf: data.uf,
        opcoes: [
          { id: 'sedex', nome: 'SEDEX', prazo: prazoBase + ' a ' + (prazoBase + 2) + ' dias úteis', valor: freteGratis ? 0 : baseSedex, icon: '📦' },
          { id: 'pac', nome: 'PAC — Encomenda', prazo: (prazoBase + 3) + ' a ' + (prazoBase + 7) + ' dias úteis', valor: freteGratis ? 0 : basePAC, icon: '📬' },
          { id: 'expresso', nome: 'SEDEX 10 — Expressa', prazo: prazoBase <= 1 ? '1 dia útil' : '1 a ' + prazoBase + ' dias úteis', valor: freteGratis ? 0 : baseExpresso, icon: '⚡' }
        ]
      };

      FRETE_CACHE[cep] = resultado;
      callback(resultado);
      resetFreteBtn();
    })
    .catch(function() {
      var resultado = freteSimuladoFallback(cep);
      FRETE_CACHE[cep] = resultado;
      callback(resultado);
      resetFreteBtn();
    });
}

function calcDistanciaPorUF(uf) {
  var distancias = {
    'MG':0,'SP':2,'RJ':3,'ES':2,'GO':1,'DF':2,'MS':3,'MT':4,
    'BA':4,'SE':5,'AL':5,'PE':6,'PB':6,'RN':6,'CE':7,'PI':7,'MA':8,
    'PA':9,'AP':10,'AM':10,'RR':11,'AC':11,'RO':8,'TO':5,
    'PR':3,'SC':4,'RS':5
  };
  return distancias[uf] || 5;
}

function freteSimuladoFallback(cep) {
  var region = parseInt(cep.charAt(0));
  var dist = [0,3,4,5,2,4,6,7,8,1][region] || 5;
  return {
    cep: cep,
    endereco: 'CEP ' + cep.replace(/(\d{5})(\d{3})/, '$1-$2'),
    cidade: '',
    uf: '',
    opcoes: [
      { id: 'sedex', nome: 'SEDEX', prazo: (dist+1) + ' a ' + (dist+3) + ' dias úteis', valor: Math.round((15.90 + dist*1.8)*100)/100, icon: '📦' },
      { id: 'pac', nome: 'PAC — Encomenda', prazo: (dist+4) + ' a ' + (dist+8) + ' dias úteis', valor: Math.round((12.50 + dist*0.9)*100)/100, icon: '📬' },
      { id: 'expresso', nome: 'SEDEX 10 — Expressa', prazo: dist <= 1 ? '1 dia útil' : '1 a ' + (dist+1) + ' dias úteis', valor: Math.round((28.90 + dist*2.8)*100)/100, icon: '⚡' }
    ]
  };
}

function resetFreteBtn() {
  var btn = document.getElementById('btn-calc-frete');

function selecionarFrete(opcaoId) {
  var cached = FRETE_CACHE[state.frete.cep];
  if (!cached) return;
  var opc = cached.opcoes.find(function(o) { return o.id === opcaoId; });
  if (!opc) return;
  state.frete.opcao = opc.id;
  state.frete.valor = opc.valor;
  state.frete.prazo = opc.prazo;
  render();
}

  h += '<button id="btn-calc-frete" onclick="var c=document.getElementById(\'frete-cep-input\').value;state.frete.cep=c.replace(/\\D/g,\'\');calcularFrete(c,function(r){state.frete.calculado=true;if(!state.frete.opcao&&r.opcoes.length)selecionarFrete(r.opcoes[0].id);else render();})">Calcular</button>';

  }
  h += '</div>';

  if (state.logoEditorOpen && !e.target.closest('.header-logo')) {
    state.logoEditorOpen = false;
    render();
  }
});

// INIT
render();
</script>
